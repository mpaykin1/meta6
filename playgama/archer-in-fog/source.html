<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const $=id=>document.getElementById(id);
const V3=THREE.Vector3;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const damp=(a,b,l,dt)=>a+(b-a)*(1-Math.exp(-l*dt));
const dampV=(v,t,l,dt)=>v.lerp(t,1-Math.exp(-l*dt));
const clamp=THREE.MathUtils.clamp;
const FOG_HEX=0x5677b8;

/* =========================================================
   TEXTURES — pixel atlas (generated once, nearest filter)
   ========================================================= */
const TS=16, NT=8;
const T={STONE:0,COBBLE:1,MOSS:2,SNOW:3,SNOWSIDE:4,RUST:5,PLANK:6,DEEP:7};
const TILE_NAMES=['Камень','Булыжник','Мшистый булыжник','Снег','Камень под снегом','Ржавая земля','Тёмные доски','Глубинный кирпич'];
function makeAtlas(){
  const W=TS*NT, c=document.createElement('canvas'); c.width=W; c.height=TS;
  const g=c.getContext('2d'), img=g.createImageData(W,TS), d=img.data, R=rng(11);
  const cl=v=>v<0?0:v>255?255:v|0;
  const put=(t,x,y,r,gg,b)=>{const i=(y*W+t*TS+x)*4;d[i]=cl(r);d[i+1]=cl(gg);d[i+2]=cl(b);d[i+3]=255};
  const cob=(t,base,moss)=>{
    const pts=[];for(let i=0;i<7;i++)pts.push([R()*16,R()*16,(R()-.5)*34]);
    for(let y=0;y<16;y++)for(let x=0;x<16;x++){
      let d1=1e9,d2=1e9,k=0;
      for(let i=0;i<7;i++)for(const ox of[-16,0,16])for(const oy of[-16,0,16]){const dx=x-pts[i][0]-ox,dy=y-pts[i][1]-oy,q=Math.hypot(dx,dy);if(q<d1){d2=d1;d1=q;k=i}else if(q<d2)d2=q}
      if(d2-d1<1.25){const m=base-58+(R()-.5)*10;put(t,x,y,m,m+3,m+12);continue}
      let s=base+pts[k][2]+(R()-.5)*16-d1*2.2;
      if(moss&&R()<.42&&(y<9||R()<.3)){put(t,x,y,s*.62,s*.85,s*.55);continue}
      put(t,x,y,s,s+5,s+16);
    }
  };
  // 0 stone
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){let s=122+(R()-.5)*22;if((y*7+x*3)%23==0)s-=26;put(0,x,y,s,s+5,s+15)}
  cob(1,132,false); cob(2,126,true);
  // 3 snow
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){const s=228+(R()-.5)*14;put(3,x,y,s-6,s-1,s+8)}
  // 4 stone under snow (side)
  const fr=[];for(let x=0;x<16;x++)fr.push(2+(R()*4|0));
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    if(y<fr[x]){const s=226+(R()-.5)*12;put(4,x,y,s-6,s,s+8)}
    else{let s=124+(R()-.5)*24;if(((x>>2)+(y>>2))%3==0)s-=10;put(4,x,y,s,s+5,s+16)}
  }
  // 5 rust earth (speckled red-brown)
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){const r=R();let c=[112,64,58];if(r<.18)c=[72,36,36];else if(r<.32)c=[150,92,80];else if(r<.4)c=[94,82,92];const n=(R()-.5)*18;put(5,x,y,c[0]+n,c[1]+n,c[2]+n)}
  // 6 dark planks
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){let s=(R()-.5)*14;if(y%4==3)s-=22;if((x+(y>>2)*5)%9==0&&y%4!=3)s-=14;put(6,x,y,74+s,55+s,42+s)}
  // 7 deep bricks
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){const row=y>>2,off=(row&1)*4;let s=66+(R()-.5)*14;if(y%4==3||((x+off)%8)==7)s=42;put(7,x,y,s,s+3,s+12)}
  g.putImageData(img,0,0);
  const tx=new THREE.CanvasTexture(c); tx.magFilter=tx.minFilter=THREE.NearestFilter; tx.generateMipmaps=false; tx.colorSpace=THREE.SRGBColorSpace;
  return tx;
}
function pixTex(seed,base,spec,size=16,pat){
  const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');const img=g.createImageData(size,size);const R=rng(seed);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){const i=(y*size+x)*4;let col=base;const r=R();
    if(pat==='scale'){const k=((x+((y>>2)&1)*2)%4==0)||y%4==0;col=k?spec[0]:(r<.12?spec[1]:base)}
    else col=r<.14?spec[0]:(r<.22?spec[1]:base);
    const n=(R()-.5)*10;img.data[i]=col[0]+n;img.data[i+1]=col[1]+n;img.data[i+2]=col[2]+n;img.data[i+3]=255}
  g.putImageData(img,0,0);const tx=new THREE.CanvasTexture(c);tx.magFilter=tx.minFilter=THREE.NearestFilter;tx.generateMipmaps=false;tx.colorSpace=THREE.SRGBColorSpace;return tx;
}
const atlas=makeAtlas();

/* block material: per-instance side/top tile from the atlas */
const blockMat=new THREE.MeshLambertMaterial({map:atlas});
blockMat.onBeforeCompile=sh=>{
  sh.vertexShader=sh.vertexShader
   .replace('#include <common>','#include <common>\nattribute float aSide;\nattribute float aTop;')
   .replace('#include <uv_vertex>',`#include <uv_vertex>
    { float tl = normal.y>0.5 ? aTop : (normal.y<-0.5 ? (aSide==4.0?0.0:aSide) : aSide);
      vMapUv = vec2((uv.x*0.98+0.01 + tl)/${NT}.0, uv.y); }`);
};

/* =========================================================
   RENDERER + POST
   ========================================================= */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
const PR=Math.min(window.devicePixelRatio||1,2);
renderer.setPixelRatio(PR);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,0.1,1200);

const scene=new THREE.Scene();      // game
const gScene=new THREE.Scene();     // asset gallery
const composer=new EffectComposer(renderer);
composer.setPixelRatio(PR*0.82);    // ~80% render target
const renderPass=new RenderPass(scene,camera); composer.addPass(renderPass);
const bloom=new UnrealBloomPass(new THREE.Vector2(256,256),0.7,0.55,0.93); composer.addPass(bloom);
const post=new ShaderPass({
  uniforms:{tDiffuse:{value:null},uTime:{value:0},uAberr:{value:1},uGrain:{value:.05},uGlitch:{value:0},uVig:{value:.5},uRes:{value:new THREE.Vector2(1,1)},uDanger:{value:0}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform sampler2D tDiffuse;uniform float uTime,uAberr,uGrain,uGlitch,uVig,uDanger;uniform vec2 uRes;varying vec2 vUv;
  float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  void main(){
    vec2 uv=vUv;
    float band=floor(uv.y*38.0);float tk=floor(uTime*18.0);
    float g=step(1.0-uGlitch*0.22,h(vec2(band,tk)));
    uv.x+=g*(h(vec2(band,tk+3.0))-0.5)*0.09*uGlitch;
    vec2 d=uv-0.5;float r=dot(d,d);
    float ab=uAberr*(0.0025+r*0.03)+g*0.01;
    vec3 c=vec3(texture2D(tDiffuse,uv+d*ab).r,texture2D(tDiffuse,uv).g,texture2D(tDiffuse,uv-d*ab).b);
    c=mix(c,c*vec3(0.9,1.0,1.14),0.4);
    c*=1.0-uVig*smoothstep(0.12,0.75,r*1.7);
    c=mix(c,c*vec3(0.75,0.8,1.05),uDanger*smoothstep(0.05,0.6,r*1.7));
    c+=(h(uv*uRes+fract(uTime*7.31)*91.0)-0.5)*uGrain;
    gl_FragColor=vec4(c,1.0);
  }`
});
composer.addPass(post);
composer.addPass(new OutputPass());

let ptScale=400;
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false); composer.setSize(w,h);
  camera.aspect=w/h; camera.fov=w<h?74:58; camera.updateProjectionMatrix();
  post.uniforms.uRes.value.set(w*PR*.82,h*PR*.82);
  ptScale=h*PR*.82/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2));
}
addEventListener('resize',resize); resize();
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* =========================================================
   ATMOSPHERE: sky, fog, specks, fog sheets
   ========================================================= */
const NOISE=`float hh(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hh(i),hh(i+vec2(1,0)),f.x),mix(hh(i+vec2(0,1)),hh(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*vn(p);p*=2.03;a*=.5;}return s;}`;

function makeSky(){
  const m=new THREE.ShaderMaterial({
    uniforms:{uHor:{value:new THREE.Color(FOG_HEX)},uTop:{value:new THREE.Color(0x86a6df)},uLow:{value:new THREE.Color(0x3f5c96)},uSun:{value:new THREE.Color(0xc9dcff)},uDir:{value:new V3(-.45,.75,.35).normalize()},uTime:{value:0}},
    vertexShader:`varying vec3 vD;void main(){vD=normalize(position);vec4 p=projectionMatrix*modelViewMatrix*vec4(position,1.);gl_Position=p.xyww;}`,
    fragmentShader:`uniform vec3 uHor,uTop,uLow,uSun,uDir;uniform float uTime;varying vec3 vD;${NOISE}
    void main(){vec3 d=normalize(vD);float h=d.y;vec3 c=mix(uHor,uTop,smoothstep(0.02,0.75,h));c=mix(c,uLow,smoothstep(-0.02,-0.7,h));
      float s=max(dot(d,uDir),0.);c+=uSun*(pow(s,5.)*.22+pow(s,40.)*.35);
      float cl=fbm(d.xz/(abs(d.y)+.35)*2.2+vec2(uTime*.01,0.));c=mix(c,c*1.12,smoothstep(.45,.8,cl)*smoothstep(0.,.4,h));
      gl_FragColor=vec4(c,1.);}`,
    side:THREE.BackSide,depthWrite:false,depthTest:false,fog:false});
  const s=new THREE.Mesh(new THREE.SphereGeometry(800,32,16),m); s.renderOrder=-10; s.frustumCulled=false; return s;
}
function makeSpecks(n){
  const g=new THREE.BufferGeometry();const pos=new Float32Array(n*3),seed=new Float32Array(n*3);const R=rng(5);
  for(let i=0;i<n*3;i++)seed[i]=R();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('aSeed',new THREE.BufferAttribute(seed,3));
  const m=new THREE.ShaderMaterial({uniforms:{uTime:{value:0},uC:{value:new V3()},uScale:{value:400},uWind:{value:1},uDrift:{value:0},uAmt:{value:1}},
    vertexShader:`attribute vec3 aSeed;uniform float uTime,uScale,uWind,uDrift,uAmt;uniform vec3 uC;varying float vA;varying float vS;

function onArrowHit(a,obj){
  a.stuck=obj;a.life=5;obj.attach(a.m);
  dragon.hit();AU.hit();G.shake=Math.max(G.shake,.25);
  const p=new V3();a.m.getWorldPosition(p);
  for(let i=0;i<16;i++)sparks.spawn(p,new V3((Math.random()-.5)*9,Math.random()*7,(Math.random()-.5)*9),.14,.5+Math.random()*.4,new THREE.Color(.5,1.6,2),0,9);
  // маленькие красные пиксели
  for(let i=0;i<22;i++)sparks.spawn(p,new V3((Math.random()-.5)*8,Math.random()*6+1,(Math.random()-.5)*8),.16+Math.random()*.1,.7+Math.random()*.5,new THREE.Color(2.2,.15,.12),0,12);
  if(G.mode==='play'){dropLoot(p,'coin',1+(Math.random()<.4?1:0));if(Math.random()<.07)dropLoot(p,'heart');if(Math.random()<.15)dropLoot(p,'ice')}
  const dmg=a.dmg||1;
  if(a.freeze){dragon.frozen=2.8;AU.ice();for(let i=0;i<24;i++)sparks.spawn(p,new V3((Math.random()-.5)*10,Math.random()*6,(Math.random()-.5)*10),.2,.9,new THREE.Color(1,2.4,3.2),0,6);if(!capQ.length)caption('ЗАМОРОЖЕН')}
  if(['windup','dive','tail','spin'].includes(G.phase)){G.repelHits+=dmg*(a.freeze?2:1);showRepel();if(G.repelHits>=G.repelNeed)repel()}
  else if(G.phase==='fight'||G.phase==='intro'){G.hits=Math.min(G.need,G.hits+dmg);renderHP();G.rage=Math.max(0,G.rage-.6);
    if(G.hits>=G.need){G.phase='retreat';G.pt=0;dragon.jawOpen=1;AU.roar();caption('ДРАКОН ОТСТУПИЛ');G.glitch=.6;flashScreen(.25);dropLoot(p,'coin',4+G.level)}}
}
function crash(push){
  G.lives=(G.lives||1)-1;if(G.lives<=0)G.dead=true;renderRes();$('hint').style.opacity=0;
  const imp=archer.root.position.clone();const n=cur.shatter(imp,push||dragon.vel,debris,10,17);
  if(push){_v.copy(dragon.root.position).sub(imp);_v.y=0;if(_v.lengthSq()>.01)G.diveDir.copy(_v.normalize())}
  for(let j=fireballs.length-1;j>=0;j--)if(!fireballs[j].far){explode(fireballs[j].m.position.clone(),.8);killFireball(j)}
  for(let i=0;i<40;i++)dust.spawn(imp.clone().add(new V3((Math.random()-.5)*6,(Math.random()-.5)*6,(Math.random()-.5)*6)),new V3((Math.random()-.5)*10,Math.random()*5,(Math.random()-.5)*10),3+Math.random()*3,2.5+Math.random()*2,new THREE.Color(.62,.72,.92),1.6,-.5);
  AU.crash();G.shake=1.4;G.glitch=1.3;G.slow=.28;flashScreen(.5);
  // archer falls toward next tower
  const p0=archer.root.position.clone(),p1=nxt.stand.clone();const gr=16,vy0=5;const dy=p0.y-p1.y;
  const Tt=(vy0+Math.sqrt(vy0*vy0+2*gr*dy))/gr;G.fallFrom.copy(p0);G.fallDur=Tt;G.fallT=0;G.fallV.set((p1.x-p0.x)/Tt,vy0,(p1.z-p0.z)/Tt);
  archer.fall=1;G.phase='fall';G.pt=0;caption('ПАДЕНИЕ');
}
function land(){
  archer.root.position.copy(nxt.stand);archer.fall=0;archer.squash=1;AU.land();G.shake=.6;
  for(let i=0;i<14;i++)dust.spawn(nxt.stand.clone().add(new V3((Math.random()-.5)*2,0,(Math.random()-.5)*2)),new V3((Math.random()-.5)*6,Math.random()*1.5,(Math.random()-.5)*6),1.6,1.6,new THREE.Color(.7,.78,.95),1.2,0);
  cur=nxt;nxt=makeNext(cur);G.depth++;$('depth').textContent='ЯРУС '+G.depth;
  if(G.dead){towers=towers.filter(t=>{if(t.origin.y>cur.origin.y+60){t.dispose();return false}return true});gameOver();return}
  towers=towers.filter(t=>{if(t.origin.y>cur.origin.y+60){t.dispose();return false}return true});
  startRound();caption('ЕЩЁ ЖИВ');
}

function aimPoint(out){ray.setFromCamera(G.aimNdc,camera);
  for(const f of fireballs){if(f.far)continue;if(ray.ray.distanceToPoint(f.m.position)<2.6){const from=archer.handPos(new V3());return out.copy(f.m.position).addScaledVector(f.v,from.distanceTo(f.m.position)/weapon().speed)}}
  const d=clamp(camera.position.distanceTo(dragon.root.position),12,90);return out.copy(ray.ray.origin).addScaledVector(ray.ray.direction,d)}
function setNdc(e){G.aimNdc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1)}
canvas.addEventListener('pointerdown',e=>{if(G.mode!=='play'||G.paused||G.phase==='over')return;AU.init();setNdc(e);G.holding=true;G.lastTap=performance.now();$('hint').style.opacity=0;tryFire()});

function tryFire(){if(G.paused||G.fireCD>0||archer.fall>0||G.phase==='fall'||G.phase==='over')return;const w=weapon();G.fireCD=w.cd;archer.shoot();AU.shoot();
  const fz=G.freezeOn&&G.freezeAmmo>0;if(fz){G.freezeAmmo--;if(G.freezeAmmo<=0)G.freezeOn=false;renderRes()}
  setTimeout(()=>{if(archer.fall>0)return;const from=archer.handPos(new V3()),d=aimPoint(new V3()).sub(from);
    for(let k=0;k<w.n;k++){const dd=d.clone().applyAxisAngle(new V3(0,1,0),(k-(w.n-1)/2)*w.spread);fireArrow(from,from.clone().add(dd),{speed:w.speed,dmg:w.dmg,fire:w.fire,freeze:fz})}},90)}

/* =========================================================
   GAME UPDATE
   ========================================================= */
const _v=new V3(),_w=new V3(),_aimDir=new V3();
function updateGame(dt,t){
  G.pt+=dt;G.fireCD-=dt;if(G.holding)tryFire();
  const c=cur.origin,ap=archer.root.position;const head=_w.copy(ap).add(new V3(0,1.6,0));
  let climb=0;
  switch(G.phase){
    case 'intro':case 'fight':{
      if(G.phase==='intro'&&G.pt>2.5){G.phase='fight';G.pt=0}
      G.orbitA+=dt*(.42+G.level*.035)*G.orbitDir;
      const R=23+Math.sin(t*.37)*4;const tgt=_v.set(c.x+Math.cos(G.orbitA)*R,ap.y+5+Math.sin(t*.6)*3.5,c.z+Math.sin(G.orbitA)*R);
      dragon.steer(tgt,G.phase==='intro'?30:15+G.level*.6,1.4,dt);dragon.fold=damp(dragon.fold,0,3,dt);dragon.claw=damp(dragon.claw,0,3,dt);dragon.jawOpen=damp(dragon.jawOpen,0,3,dt);
      climb=clamp(dragon.vel.y*.15,0,1);
      if(G.phase==='fight'){G.rage+=dt*(dragon.frozen>0?0:1);if(G.rage>=G.rageMax)startSpecial()}
      if(G.phase==='fight'&&performance.now()-G.lastTap>7000){$('hint').style.opacity=1}
      if(G.phase==='intro')$('hint').style.opacity=0;
      if(G.phase==='fight'){G.spitT-=dt;
        if(G.spitT<=0&&!(G.charging>0)&&dragon.root.position.distanceTo(ap)<48){G.charging=.8;AU.spit(.6)}
        if(G.charging>0&&!(dragon.frozen>0)){G.charging-=dt;dragon.jawOpen=damp(dragon.jawOpen,1,8,dt);dragon.charge=damp(dragon.charge,1,6,dt);
          if(G.charging<=0){spitAttack();G.spitT=diff(G.level).interval+Math.random()*2;dragon.charge=0;
            if(!G.fbTold){caption('СБЕЙ ОГОНЬ');G.fbTold=true}}}}
      break}
    case 'windup':{
      const tgt=_v.copy(ap).addScaledVector(G.diveDir,40);tgt.y=ap.y+13;dragon.steer(tgt,26,1.8,dt);climb=1;dragon.jawOpen=damp(dragon.jawOpen,.8,4,dt);
      G.glitch=Math.max(G.glitch,.35+G.pt*.15);
      if(diff(G.level).combo&&!G.comboDone&&G.pt>.8){G.comboDone=true;spitAttack()}
      if(G.pt>Math.max(1.4,2.4-G.level*.12)){G.phase='dive';G.pt=0}
      break}
    case 'dive':{
      const tgt=_v.copy(ap).add(new V3(0,.6,0));dragon.steer(tgt,Math.min(72,48+G.level*2.5),3.2,dt);dragon.fold=damp(dragon.fold,.6,4,dt);dragon.claw=damp(dragon.claw,1,4,dt);dragon.jawOpen=damp(dragon.jawOpen,1,6,dt);
      G.glitch=Math.max(G.glitch,.5);G.shake=Math.max(G.shake,.15);
      if(dragon.root.position.distanceTo(tgt)<4.5)crash();
      break}
    case 'fall':{
      G.fallT+=dt;const k=Math.min(G.fallT,G.fallDur);
      ap.set(G.fallFrom.x+G.fallV.x*k,G.fallFrom.y+G.fallV.y*k-8*k*k,G.fallFrom.z+G.fallV.z*k);archer.vel.set(G.fallV.x,G.fallV.y-16*k,G.fallV.z);
      // dragon carries through and swoops away
      const out=_v.copy(G.diveDir).multiplyScalar(-30).add(c);out.y=nxt.stand.y+14;dragon.steer(out,34,1.2,dt);dragon.fold=damp(dragon.fold,.1,2,dt);dragon.claw=damp(dragon.claw,0,2,dt);climb=.8;
      if(G.fallT>=G.fallDur)land();
      break}
    case 'tail':{const P=_v.copy(ap).addScaledVector(G.tailPerp,6.5);P.y=ap.y+1.2;dragon.steer(P,30+G.level,2.4,dt);dragon.claw=damp(dragon.claw,1,3,dt);dragon.jawOpen=damp(dragon.jawOpen,.6,3,dt);
      G.glitch=Math.max(G.glitch,.35);climb=.5;
      if(dragon.root.position.distanceTo(P)<3.4||G.pt>5){G.phase='spin';G.pt=0;G.spinHit=false;dragon.spinV=-G.tailSide*7.5;dragon.vel.multiplyScalar(.2);AU.roar()}
      break}
    case 'spin':{dragon.steer(_v.copy(dragon.root.position),1,3,dt);G.shake=Math.max(G.shake,.2);G.glitch=Math.max(G.glitch,.5);
      if(G.pt>.42&&!G.spinHit){G.spinHit=true;crash(G.tailPerp.clone().multiplyScalar(-22))}
      break}
    case 'stagger':{const away=_v.copy(dragon.root.position).sub(ap);away.y=0;away.normalize().multiplyScalar(30).add(ap);away.y=ap.y+10;dragon.steer(away,20,1.2,dt);
      dragon.jawOpen=damp(dragon.jawOpen,.4,2,dt);dragon.fold=damp(dragon.fold,0,3,dt);dragon.claw=damp(dragon.claw,0,3,dt);climb=1;
      if(G.pt>2.2){G.phase='fight';G.pt=0;$('hint').style.opacity=0;$('hint').textContent=HINT0}
      break}
    case 'over':{G.orbitA+=dt*.3;dragon.steer(_v.set(c.x+Math.cos(G.orbitA)*26,ap.y+8,c.z+Math.sin(G.orbitA)*26),14,1.2,dt);break}
    case 'retreat':{
      const away=_v.copy(dragon.root.position).sub(ap);away.y=0;away.normalize().multiplyScalar(80).add(ap);away.y=ap.y+28;dragon.steer(away,26,1.2,dt);climb=1;
      dragon.jawOpen=damp(dragon.jawOpen,.3,2,dt);
      if(G.pt>4)levelUp();
      break}
  }
  dragon.animate(dt,t,head,climb);
  // wing flap sound on downstroke peaks
  const fs=Math.sin(dragon.ph);if(G.flapPrev>0&&fs<=0){const dd=dragon.root.position.distanceTo(camera.position);AU.flap(clamp(.5-dd/120,0,.4))}G.flapPrev=fs;
  // archer
  if(G.phase!=='fall'&&G.phase!=='over'){aimPoint(_aimDir);_aimDir.sub(head).normalize();if(!G.holding){_aimDir.copy(dragon.root.position).sub(head).normalize()}}
  archer.update(dt,t,G.phase==='fall'?null:_aimDir);
  for(const tw of towers)tw.update(t);
  // torch light follows nearest torch on current tower
  const tf=cur.fx[0];if(tf){torchLight.position.copy(tf.position);torchLight.intensity=6+Math.sin(t*13)*1.2+Math.sin(t*29)*.8}else torchLight.intensity=damp(torchLight.intensity,0,3,dt);
  // background follows with parallax
  bg.position.y=damp(bg.position.y,ap.y*.85,1,dt);
  // HUD
  $('rage').firstElementChild.style.width=(G.phase==='fight'||G.phase==='intro'?G.rage/G.rageMax*100:(['windup','dive','tail','spin'].includes(G.phase)?100:0))+'%';
  // camera
  const watch=(G.phase==='windup'||G.phase==='dive'||G.phase==='fall');
  if(!watch){_v.copy(dragon.root.position).sub(ap);_v.y=0;if(_v.lengthSq()>1)dampV(G.camDir,_v.normalize(),1.6,dt);G.camDir.normalize()}
  else dampV(G.camDir,G.diveDir,1.2,dt).normalize();
  const right=new V3().crossVectors(G.camDir,new V3(0,1,0)).normalize();
  let desP,desL;
  if(G.phase==='fall'){desP=_v.copy(ap).addScaledVector(G.camDir,-8).addScaledVector(right,3).add(new V3(0,4.5,0));desL=new V3().copy(ap).lerp(nxt.stand,.35);}
  else{desP=_v.copy(head).addScaledVector(G.camDir,-7.6).addScaledVector(right,-.7).add(new V3(0,2.2,0));
    desL=head.clone().lerp(dragon.root.position,G.phase==='dive'?.5:.55);desL.y=Math.max(desL.y,head.y)}
  dampV(camPos,desP,G.phase==='fall'?3.2:2.3,dt);dampV(camLook,desL,3,dt);
}

    if(x%2==0){add(x,1,0);add(x,1,D-1)}

  return bl;
}

  const hist=[['v1: дракон, лучник, 3 башни, 8 блоков, туман, обломки, пост, звук, галерея',5178],['+ гроза: тучи 2.5D, молнии, виадуки 2D/2.5D, огненные шары, дальний дракон, 5 карточек галереи',19636],['+ уровни: 7 тем погоды и света, таран и удар хвостом, залпы, кассетные и самонаводящиеся шары, отражение атак, добыча, жизни, 5 видов оружия, ледяные стрелы, магазин, 2 карточки галереи',22450]];
  return {sec,extra,hist};
})();
window.__INV=()=>{
  const out={sec:{},lost:[],now:0};
  const fnOk=n=>{try{return typeof eval(n)==='function'}catch(e){return false}};
  for(const [k,s] of Object.entries(INV.sec)){const r={};
    for(const n of s.fn){if(!fnOk(n))out.lost.push(k+': функция '+n);else out.now++}
    for(const [nm,f,min] of s.data){let v=0;try{v=f()}catch(e){v=0}r[nm]=v;out.now+=v;if(v<min)out.lost.push(k+': '+nm+' '+v+'/'+min)}
    out.sec[k]=r}
  out.extra=INV.extra.map(([n,f])=>{let ok=false;try{ok=!!f()}catch(e){}return {n,ok}});
  out.base=INV.hist[INV.hist.length-1][1];out.ok=!out.lost.length&&out.now>=out.base&&out.extra.every(e=>e.ok);
  out.hist=INV.hist;return out;
};

/* =========================================================
   MAIN LOOP
   ========================================================= */
initWorld();
const clock=new THREE.Clock();let fade=0,menuA=0;
function frame(){
  requestAnimationFrame(frame);
  const rdt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  G.slow=damp(G.slow,1,1.3,rdt);const dt=(G.paused?0:rdt)*G.slow;
  fade=Math.min(1,fade+rdt*.5);
  if(capQ.length||$('cap').classList.contains('show')){capT-=rdt;if(capT<=0)showWord()}
  if(G.mode==='gallery'){
    const it=galBuild(gi);it.upd(rdt,t);gDebris.update(rdt);gDust.update(rdt);gFire.update(rdt);gFarDeb.update(rdt);gBoom.intensity=damp(gBoom.intensity,0,4,rdt);
    if(gi!==10)STORM.flash=damp(STORM.flash,0,5,rdt);{const u=farMat.uniforms;u.uCam.value.copy(camera.position);u.uFlash.value=STORM.flash;u.uFlashPos.value.copy(STORM.flashPos);u.uTime.value=t}
    const g=GAL[gi];menuA+=rdt*.22;const r=g.r;
    dampV(camPos,_v.set(g.look.x+Math.cos(menuA)*r,g.look.y+r*.28+Math.sin(t*.3)*r*.05,g.look.z+Math.sin(menuA)*r),2,rdt);dampV(camLook,g.look,3,rdt);
    camera.position.copy(camPos);camera.lookAt(camLook);updateAtmosphere(gAtmo,t,g.look,camera);
    post.uniforms.uGlitch.value=Math.max(0,Math.sin(t*.7)*.3-.2);post.uniforms.uDanger.value=0;
  }else{
    if(G.mode==='play')updateGame(dt,t);
    else{ // menu: dragon circles, slow cinematic orbit
      G.orbitA+=rdt*.35;const c=cur.origin;dragon.steer(_v.set(c.x+Math.cos(G.orbitA)*24,c.y+6+Math.sin(t*.6)*3,c.z+Math.sin(G.orbitA)*24),15,1.4,rdt);
      dragon.animate(rdt,t,archer.root.position,0);archer.update(rdt,t,_w.copy(dragon.root.position).sub(archer.root.position).normalize());for(const tw of towers)tw.update(t);
      menuA+=rdt*.08;dampV(camPos,_v.set(c.x+Math.cos(menuA)*15,c.y+4+Math.sin(t*.25),c.z+Math.sin(menuA)*15),1.5,rdt);dampV(camLook,_w.copy(c).lerp(dragon.root.position,.5),2,rdt);
      const tf=cur.fx[0];if(tf){torchLight.position.copy(tf.position);torchLight.intensity=6+Math.sin(t*13)*1.2}
    }
    updateArrows(dt);debris.update(dt);dust.update(dt);sparks.update(dt);updateStormWorld(dt,t);applyTheme(rdt,t);updateLoot(dt,t);
    G.shake=damp(G.shake,0,2.2,rdt);G.glitch=damp(G.glitch,0,1.6,rdt);
    const sh=G.shake*.35;camera.position.copy(camPos).add(_v.set(Math.sin(t*37)*sh,Math.sin(t*41+1)*sh,Math.sin(t*33+2)*sh));camera.lookAt(camLook);
    updateAtmosphere(atmo,t,archer.root.position,camera);
    const danger=['windup','dive','tail','spin'].includes(G.phase)?1:0;post.uniforms.uDanger.value=damp(post.uniforms.uDanger.value,danger,3,rdt);
    post.uniforms.uGlitch.value=G.glitch+Math.max(0,Math.sin(t*.9)*Math.sin(t*2.3)-.85)*2;
  }
  post.uniforms.uTime.value=t;post.uniforms.uAberr.value=1+post.uniforms.uGlitch.value*2.5+Math.sin(t*.5)*.2;post.uniforms.uGrain.value=.055+post.uniforms.uDanger.value*.03;
  renderer.toneMappingExposure=(G.mode==='gallery'?1:TH.exp)*(.15+.85*fade);
  composer.render();
}
frame();
