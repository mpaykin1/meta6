name: Verify owner asset completeness
on:
  push:
    branches: [ai/chatgpt/stage8-manifest-completeness]
permissions:
  contents: read
jobs:
  check-owner-sources:
    if: github.actor != 'github-actions[bot]'
    concurrency:
      group: complete-owner-assets-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/chatgpt/stage8-manifest-completeness
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify full source/destination parity without writing
        run: node three-worlds-game/tools/sync-owner-assets.cjs --check
      - name: Install pinned local build tools
        run: npm ci --no-audit --no-fund --prefix three-worlds-game/tools
      - name: Build standalone game
        run: npm run build --prefix three-worlds-game/tools
      - name: Run fast behavioral and manifest tests
        run: node --test three-worlds-game/tests/*.test.mjs
