name: ABYSS GLOW Production Stand
on:
  pull_request:
    paths:
      - 'abyss-glow/stand/**'
      - 'automation/asset-quality/abyss_stand_smoke.mjs'
      - 'automation/asset-quality/abyss_single_loop_smoke.mjs'
      - 'automation/asset-quality/build_single_loop.py'
      - 'automation/asset-quality/test_build_single_loop.py'
      - 'automation/asset-quality/abyss_release_comparison.py'
      - 'automation/asset-quality/test_abyss_release_comparison.py'
      - 'automation/asset-quality/abyss_style_gate.py'
      - 'automation/asset-quality/test_abyss_style_gate.py'
      - 'automation/asset-quality/abyss_part_motion_gate.py'
      - 'automation/asset-quality/test_abyss_part_motion_gate.py'
      - 'automation/asset-quality/validate_abyss_handoff.py'
      - 'automation/asset-quality/test_validate_abyss_handoff.py'
      - 'automation/handoff/**'
      - '.github/workflows/abyss-glow-stand.yml'
  push:
    branches: [main]
    paths:
      - 'abyss-glow/stand/**'
      - 'automation/asset-quality/abyss_stand_smoke.mjs'
      - 'automation/asset-quality/abyss_single_loop_smoke.mjs'
      - 'automation/asset-quality/build_single_loop.py'
      - 'automation/asset-quality/test_build_single_loop.py'
      - 'automation/asset-quality/abyss_release_comparison.py'
      - 'automation/asset-quality/test_abyss_release_comparison.py'
      - 'automation/asset-quality/abyss_style_gate.py'
      - 'automation/asset-quality/test_abyss_style_gate.py'
      - 'automation/asset-quality/abyss_part_motion_gate.py'
      - 'automation/asset-quality/test_abyss_part_motion_gate.py'
      - 'automation/asset-quality/validate_abyss_handoff.py'
      - 'automation/asset-quality/test_validate_abyss_handoff.py'
      - 'automation/handoff/**'
      - '.github/workflows/abyss-glow-stand.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: abyss-glow-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-smoke:
    name: Original game - desktop and touch WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install free pinned browser harness
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve original autonomous HTML
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory abyss-glow/stand > /tmp/abyss-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/ > /dev/null
      - name: Run real Chromium and emulated mobile-touch scenes
        run: node automation/asset-quality/abyss_stand_smoke.mjs
      - name: Build original-preserving single-RAF candidate
        run: python3 automation/asset-quality/build_single_loop.py abyss-glow/stand/index.html abyss-glow/stand/single-loop.html
      - name: Run Python build, release and pixel-style gate tests
        run: |
          python3 -m pip install --break-system-packages 'Pillow>=10,<13'
          python3 -m unittest discover -s automation/asset-quality -p 'test_abyss_style_gate.py' -v
          python3 -m unittest discover -s automation/asset-quality -p 'test_abyss_part_motion_gate.py' -v
          python3 -m unittest discover -s automation/asset-quality -p 'test_validate_abyss_handoff.py' -v
          python3 automation/asset-quality/validate_abyss_handoff.py
          python3 -m unittest discover -s automation/asset-quality -p 'test_build_single_loop.py' -v
          python3 -m unittest discover -s automation/asset-quality -p 'test_abyss_release_comparison.py' -v
      - name: Independently compare original and candidate in Chromium
        run: node automation/asset-quality/abyss_single_loop_smoke.mjs
      - name: Validate release gate against actual browser evidence
        run: |
          python3 automation/asset-quality/abyss_release_comparison.py --original abyss-glow/evidence/browser-report.json --candidate abyss-glow/evidence/single-loop-comparison.json --source abyss-glow/stand/index.html --output abyss-glow/evidence/release-gate.json
      - name: Upload full browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abyss-glow-production-browser-evidence
          path: abyss-glow/evidence/
          retention-days: 14
          if-no-files-found: warn

  deploy-pages:
    name: Publish stand without removing existing Meta6 pages
    if: github.event_name != 'pull_request'
    needs: production-smoke
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve all existing public site paths
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='node_modules/' --exclude='_site/' --exclude='abyss-glow/evidence/' --exclude='abyss-glow/generated/' --exclude='abyss-glow/stand/single-loop.html' ./ _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/abyss-glow/stand/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy verified stand
        id: deployment
        uses: actions/deploy-pages@v4
