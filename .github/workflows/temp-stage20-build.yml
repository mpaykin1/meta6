name: TEMP Stage20 standalone rebuild
on:
  push:
    branches:
      - 'ai/chatgpt/stage20-guest-lifecycle'
    paths:
      - 'three-worlds-game/rift-story.mjs'
      - 'three-worlds-game/tests/rift-story.test.mjs'
      - '.github/workflows/temp-stage20-build.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/chatgpt/stage20-guest-lifecycle
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deterministic offline standalone build
        working-directory: three-worlds-game/tools
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Node regression
        run: node --test three-worlds-game/tests/*.test.mjs
      - name: Commit generated standalone ONLY on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add three-worlds-game/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(three-worlds): regenerate offline after guest lifecycle fix'
            git push origin HEAD:refs/heads/ai/chatgpt/stage20-guest-lifecycle
          fi
