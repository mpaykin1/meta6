name: META GAMES native packages

# Build candidates only: no Play Console / Steam publication, signing, or auto-publishing.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'platforms/**'
      - '.github/workflows/meta-games-native-build.yml'

permissions:
  contents: read

jobs:
  steam-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native packager
        working-directory: platforms
        run: npm install --no-audit --no-fund
      - name: Package Windows app
        working-directory: platforms
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run desktop:pack
      - uses: actions/upload-artifact@v4
        with:
          name: meta-games-windows-candidate
          path: platforms/release/*.exe
          if-no-files-found: error
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager unavailable"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Install native packager
        working-directory: platforms
        run: npm install --no-audit --no-fund
      - name: Create Android WebView project
        working-directory: platforms
        run: |
          npm run prepare:play
          npm run android:init
          npm run android:sync
      - name: Package debug APK
        working-directory: platforms/android
        run: bash ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: meta-games-android-debug-candidate
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
