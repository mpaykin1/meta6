name: Archer in the Fog - Playgama Package
on:
  push:
    branches:
      - playgama-archer-in-fog-release
    paths:
      - "playgama/archer-in-fog/**"
      - ".github/workflows/archer-playgama.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playgama/archer-in-fog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: |
          npm init -y
          npm install --no-audit --no-fund --no-save vite@6 three@0.160.0 @fontsource/russo-one
      - name: Build self-contained game
        run: |
          python3 prepare.py
          npx vite build --base=./ --target=esnext
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('dist')
          with zipfile.ZipFile('archer-in-the-fog.zip','w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for p in root.rglob('*'):
              if p.is_file():z.write(p,p.relative_to(root).as_posix())
          print('PLAYGAMA_ZIP_BYTES='+str(Path('archer-in-the-fog.zip').stat().st_size))
          PY
      - name: Include Bridge config in Playgama build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import json
          original=Path('archer-in-the-fog.zip')
          config={"advertisement":{"minimumDelayBetweenInterstitial":60,"interstitial":{"placements":[{"id":"game_over"}]}}}
          with ZipFile(original) as a, ZipFile('corrected.zip','w',ZIP_DEFLATED,compresslevel=9) as b:
            for name in a.namelist():
              data=a.read(name)
              if name=='index.html':
                data=data.replace('DRAGON<br>ПОБЕДИЛ'.encode(),'DRAGON<br>WON'.encode())
              b.writestr(name,data)
            b.writestr('playgama-bridge-config.json',json.dumps(config,separators=(',',':')))
          original.unlink()
          Path('corrected.zip').rename(original)
          print('PLAYGAMA_FIXED_ZIP_BYTES='+str(original.stat().st_size))
          PY
      - name: Send build to Playgama when upload slot is available
        if: hashFiles('playgama/archer-in-fog/upload-once.json') != ''
        run: |
          cd playgama/archer-in-fog
          python3 - <<'PY'
          import json,urllib.request
          from pathlib import Path
          c=json.loads(Path('upload-once.json').read_text())
          data=Path('archer-in-the-fog.zip').read_bytes()
          assert len(data)==c['size'],f"Archive size changed: {len(data)} not {c['size']}"
          request=urllib.request.Request(c['url'],data=data,method='PUT',headers=c['headers'])
          with urllib.request.urlopen(request,timeout=120) as response:
            print('PLAYGAMA_PUT_STATUS='+str(response.status))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: archer-in-the-fog-playgama
          path: playgama/archer-in-fog/archer-in-the-fog.zip
          retention-days: 7
