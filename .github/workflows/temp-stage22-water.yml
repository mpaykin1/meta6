name: TEMP Owner2114 Water Entry Forensic
on:
  push:
    branches:
      - 'ai/chatgpt/stage22-water-entry'
    paths:
      - 'three-worlds-game/tests/owner-2114-water-entry-browser.mjs'
      - '.github/workflows/temp-stage22-water.yml'
permissions:
  contents: read
jobs:
  water:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          node three-worlds-game/tests/owner-2114-water-entry-browser.mjs
