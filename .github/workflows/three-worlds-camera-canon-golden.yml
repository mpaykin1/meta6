name: Three Worlds Island Camera Golden
on:
  push:
    branches: [ai/chatgpt/stage11-camera-canon-golden]
permissions:
  contents: write
jobs:
  camera-canon:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/chatgpt/stage11-camera-canon-golden
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pinned offline builder
        working-directory: three-worlds-game/tools
        run: npm ci --no-audit --no-fund
      - name: Rebuild standalone from the single Island camera source
        working-directory: three-worlds-game/tools
        run: npm run build
      - name: Reference golden 600 steps and full fast regression suite
        run: |
          set -euo pipefail
          mkdir -p three-worlds-game/evidence
          node --test three-worlds-game/tests/*.test.mjs | tee three-worlds-game/evidence/camera-golden-tests.txt
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real mobile canvas fixed, camera chase, worlds and rift
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          node three-worlds-game/tests/owner042-044-browser.mjs
      - name: Commit only after golden and real browser pass
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add three-worlds-game/index.html three-worlds-game/evidence/camera-golden-tests.txt three-worlds-game/evidence/owner042-044-code.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(camera): verified Island canonical standalone and golden evidence'
          git fetch origin ai/chatgpt/stage11-camera-canon-golden
          git rebase origin/ai/chatgpt/stage11-camera-canon-golden
          git push origin HEAD:ai/chatgpt/stage11-camera-canon-golden
