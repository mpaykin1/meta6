name: Sumerek golden guard
on:
  pull_request:
    paths: ['reference/sumerek-golden/**', 'ashen-sumerek/**', 'underwater-sumerek/**']
  push:
    branches: [main]
    paths: ['reference/sumerek-golden/**', 'ashen-sumerek/**']
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Golden references unchanged
        run: cd reference/sumerek-golden && sha256sum -c SHA256SUMS
      - name: ashen-sumerek/index.html reproduces from sources
        run: |
          pip install pillow
          cd ashen-sumerek && cp index.html /tmp/before.html && python3 patch_ash.py >/dev/null
          cmp index.html /tmp/before.html || { echo "index.html не воспроизводится из ash_*.js: правь исходники и пересобери patch_ash.py"; exit 1; }
