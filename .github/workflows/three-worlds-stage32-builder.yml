name: Temporary Stage32 rain standalone build
on:
  push:
    branches: ['ai/chatgpt/stage32-island-rain']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned deps
        working-directory: three-worlds-game/tools
        run: npm ci --no-audit --no-fund
      - name: Fast rain accepted test
        run: node --test three-worlds-game/tests/accepted/rain-event-cycle.test.mjs three-worlds-game/tests/accepted/rain-weather.test.mjs
      - name: Rebuild standalone file
        working-directory: three-worlds-game/tools
        run: npm run build
      - name: Commit updated game without new dependencies
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add three-worlds-game/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(three-worlds): original rain event in standalone'
            git push origin HEAD:ai/chatgpt/stage32-island-rain
          fi
