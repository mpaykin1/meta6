name: Temporary Three Worlds stage28 deterministic offline rebuild
on:
  push:
    branches: ['ai/chatgpt/audit044-guest-contract']
permissions:
  contents: write
jobs:
  stage28-offline-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned existing build dependencies
        working-directory: three-worlds-game/tools
        run: npm ci --no-audit --no-fund
      - name: Build one-file existing offline game
        working-directory: three-worlds-game/tools
        run: npm run build
      - name: Fast deterministic unit tests
        run: node --test three-worlds-game/tests/rift-story.test.mjs three-worlds-game/tests/owner-2116-original-guest-roster.test.mjs
      - name: Commit reproducible standalone output to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add three-worlds-game/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(three-worlds): sync standalone after audit044 repairs'
            git push origin HEAD:ai/chatgpt/audit044-guest-contract
          fi
