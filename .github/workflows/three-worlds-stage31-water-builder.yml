name: Temporary Stage31 water input red control and offline build
on:
  push:
    branches: ['ai/chatgpt/stage31-water-controls']
permissions:
  contents: write
jobs:
  stage31-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact current game builder
        working-directory: three-worlds-game/tools
        run: npm ci --no-audit --no-fund
      - name: Install pinned browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: RED control on accepted main standalone
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          set +e
          node three-worlds-game/tests/owner-2122-water-controls-browser.mjs > /tmp/water-red.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'attack button lost its real game input' /tmp/water-red.log
          echo WATER_INPUT_RED_CONTROL_VERIFIED
      - name: Rebuild corrected standalone source
        working-directory: three-worlds-game/tools
        run: npm run build
      - name: GREEN browser proof and accepted contracts
        run: |
          node three-worlds-game/tests/owner-2122-water-controls-browser.mjs
          node --test three-worlds-game/tests/accepted/water-combat.test.mjs
      - name: Commit changed offline artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add three-worlds-game/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(three-worlds): water mobile attack and jump standalone'
            git push origin HEAD:ai/chatgpt/stage31-water-controls
          fi
