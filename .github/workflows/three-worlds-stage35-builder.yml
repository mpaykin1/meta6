name: Temporary source guest build and short integrated proof
on:
  push:
    branches: ['ai/chatgpt/stage35-original-crossworld-guests']
permissions:
  contents: write
jobs:
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pinned engine deps
        working-directory: three-worlds-game/tools
        run: npm ci --no-audit --no-fund
      - name: Original source provenance and event contract
        run: node --test three-worlds-game/tests/guest-original-sources.test.mjs three-worlds-game/tests/rift-story.test.mjs
      - name: Assemble single-file offline game
        working-directory: three-worlds-game/tools
        run: npm run build
      - name: Pin browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Single owner A01 A10 A11 guest real GPU proof
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          node three-worlds-game/tests/owner-a01-a10-a11-guest-live-browser.mjs
      - name: Commit generated one-file build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add three-worlds-game/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(three-worlds): original cross-world guests and integrated browser proof'
            git push origin HEAD:ai/chatgpt/stage35-original-crossworld-guests
          fi
