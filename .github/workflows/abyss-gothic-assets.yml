name: ABYSS Gothic Asset Generator
on:
  pull_request:
    paths:
      - 'automation/asset-quality/generate_gothic_layers.py'
      - '.github/workflows/abyss-gothic-assets.yml'
      - 'abyss-glow/generated/gothic/index.html'
      - 'automation/asset-quality/gothic_preview_smoke.mjs'
      - 'automation/asset-quality/abyss_release_comparison.py'
      - 'automation/asset-quality/test_abyss_release_comparison.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate five deterministic 2.5D vector layers
        run: python3 automation/asset-quality/generate_gothic_layers.py --out /tmp/abyss-gothic
      - name: Assert geometry and manifest integrity
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,xml.etree.ElementTree as ET
          d=pathlib.Path('/tmp/abyss-gothic')
          m=json.loads((d/'manifest.json').read_text())
          assert m['status']=='generated_preview_not_integrated'
          assert len(m['assets'])==5
          for a in m['assets']:
              p=d/a['name']
              assert p.is_file() and p.stat().st_size>100
              assert hashlib.sha256(p.read_bytes()).hexdigest()==a['sha256']
              root=ET.fromstring(p.read_bytes())
              assert root.tag.endswith('svg')
              assert 0<=a['parallax']<=1
          print('PASS: 5/5 valid SVG layers, SHA-256 verified, original game untouched')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser harness
        run: npm install --no-save --no-package-lock playwright@1.58.2 && npx playwright install --with-deps chromium
      - name: Add fullscreen touch preview to artifact
        run: cp abyss-glow/generated/gothic/index.html /tmp/abyss-gothic/index.html
      - name: Serve generated assets and preview
        run: python3 -m http.server 8766 --bind 127.0.0.1 --directory /tmp/abyss-gothic > /tmp/abyss-gothic-http.log 2>&1 &
      - name: Browser smoke - portrait touch and desktop
        run: node automation/asset-quality/gothic_preview_smoke.mjs
      - name: Validate release-gate unit tests
        run: python3 -m unittest discover -s automation/asset-quality -p 'test_abyss_release_comparison.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: abyss-gothic-original-vector-layers
          path: /tmp/abyss-gothic/
          retention-days: 14
