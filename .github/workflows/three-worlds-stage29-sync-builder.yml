name: Temporary stage29 sync offline HTML
on:
  push:
    branches: ['ai/chatgpt/stage29-deep-camera']
permissions:
  contents: write
jobs:
  source-backed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pinned install
        working-directory: three-worlds-game/tools
        run: npm ci --no-audit --no-fund
      - name: Existing 120-step water depth contracts
        run: node --test three-worlds-game/tests/water-dive-camera.test.mjs
      - name: Build standalone
        working-directory: three-worlds-game/tools
        run: npm run build
      - name: Commit generated offline build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add three-worlds-game/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(three-worlds): post-rain water camera standalone'
            git push origin HEAD:ai/chatgpt/stage29-deep-camera
          fi
