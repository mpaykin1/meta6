name: Publish complete META6 site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: meta6-complete-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble complete website without deleting accepted games
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='node_modules/' --exclude='_site/' --exclude='**/evidence/' ./ _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/abyss-glow/stand/index.html
          test -s _site/abyss-glow/play/index.html
          test -s _site/observer-world-en-v7/index.html
          test -s _site/underwater-world/index.html
          test -s _site/playgama-catalog/index.html
          test -s _site/playgama-catalog/sitemap.xml
      - uses: actions/configure-pages@v5
      - name: Select unique archive name for this build attempt
        id: artifact
        shell: bash
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload website archive
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: _site
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait until the uploaded archive is discoverable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_NAME"
          for attempt in $(seq 1 30); do
            if data=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f "name=$ARTIFACT_NAME" -F per_page=100); then
              if jq -e --arg name "$ARTIFACT_NAME" --arg id "$ARTIFACT_ID" '[.artifacts[] | select(.name == $name and .expired == false and .size_in_bytes > 0)] | length == 1 and ($id == "" or (.[0].id | tostring) == $id)' <<< "$data" >/dev/null; then
                echo "Pages archive is available: $ARTIFACT_NAME"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Pages archive did not become available within 150 seconds; publication stopped before deployment."
          exit 1
      - name: Deploy full website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
      - name: Restore local files for byte-for-byte live verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='node_modules/' --exclude='_site/' --exclude='**/evidence/' ./ _site/
          touch _site/.nojekyll
      - name: Confirm live games, SEO catalog and sitemap revision
        shell: bash
        run: |
          set -euo pipefail
          base='https://mpaykin1.github.io/meta6'
          for attempt in $(seq 1 45); do
            if curl --retry 2 --max-time 20 -fsSL -H 'Cache-Control: no-cache' "$base/abyss-glow/play/index.html?rev=${GITHUB_SHA}" -o /tmp/meta6-play.html \
               && cmp -s _site/abyss-glow/play/index.html /tmp/meta6-play.html \
               && curl --max-time 20 -fsSL "$base/abyss-glow/stand/index.html?rev=${GITHUB_SHA}" -o /tmp/meta6-stand.html \
               && cmp -s _site/abyss-glow/stand/index.html /tmp/meta6-stand.html \
               && curl --max-time 20 -fsSL "$base/observer-world-en-v7/index.html?rev=${GITHUB_SHA}" -o /tmp/meta6-other.html \
               && cmp -s _site/observer-world-en-v7/index.html /tmp/meta6-other.html \
               && curl --max-time 20 -fsSL "$base/playgama-catalog/index.html?rev=${GITHUB_SHA}" -o /tmp/meta6-catalog.html \
               && cmp -s _site/playgama-catalog/index.html /tmp/meta6-catalog.html \
               && curl --max-time 20 -fsSL "$base/playgama-catalog/sitemap.xml?rev=${GITHUB_SHA}" -o /tmp/meta6-sitemap.xml \
               && cmp -s _site/playgama-catalog/sitemap.xml /tmp/meta6-sitemap.xml; then
              echo 'Full GitHub Pages site deployed: games, catalog and sitemap'
              exit 0
            fi
            sleep 10
          done
          echo 'GitHub Pages still serves a stale or incomplete version' >&2
          exit 1
