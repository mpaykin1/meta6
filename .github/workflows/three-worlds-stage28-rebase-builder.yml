name: Temporary stage28 merge-main offline rebuild
on:
  push:
    branches: ['ai/chatgpt/audit044-guest-contract']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned dependencies
        working-directory: three-worlds-game/tools
        run: npm ci --no-audit --no-fund
      - name: Regenerate standalone
        working-directory: three-worlds-game/tools
        run: npm run build
      - name: Short source and accepted tests
        run: |
          node --test three-worlds-game/tests/rift-story.test.mjs three-worlds-game/tests/accepted/visitor-arc.test.mjs
      - name: Commit offline output after merging main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add three-worlds-game/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(three-worlds): rebuild merged guest dialogue standalone'
            git push origin HEAD:ai/chatgpt/audit044-guest-contract
          fi
