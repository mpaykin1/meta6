name: Three Worlds Original Weather Catalog Golden
on:
  push:
    branches: [ai/chatgpt/stage14-island-weather-catalog-canon, ai/chatgpt/stage16-island-weather-renderer, ai/chatgpt/stage17-weather-visual-proof]
permissions:
  contents: read
jobs:
  weather-canon:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned offline game dependencies
        working-directory: three-worlds-game/tools
        run: npm ci --no-audit --no-fund
      - name: Rebuild the one standalone HTML using original THREE scene/renderer
        working-directory: three-worlds-game/tools
        run: npm run build
      - name: Shared original seven weather modes and <=600-step Island golden
        run: |
          set -euo pipefail
          node --test three-worlds-game/tests/*.test.mjs
      - name: Install browser for real original two-finger and mutation proof
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real game smoke (owner controls, environment, rain shaders, mobile)
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          node three-worlds-game/tests/owner042-044-browser.mjs
          node three-worlds-game/tests/owner-218-weather-browser.mjs
          node three-worlds-game/tests/owner-218-weather-visual-browser.mjs
          mkdir -p three-worlds-game/evidence
          node three-worlds-game/tests/owner-2111-touch-mutation-browser.mjs | tee three-worlds-game/evidence/owner-2111-mutation-proof.txt
      - name: Verify last bot-built standalone matches current source without write permissions
        run: git diff --exit-code -- three-worlds-game/index.html
      - name: Upload real gameplay weather screenshots and GPU pixel-causality manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-worlds-weather-visual-${{ github.sha }}
          path: three-worlds-game/evidence/weather-visual/
          if-no-files-found: warn
          retention-days: 14
