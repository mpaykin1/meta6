name: META GAMES guard
# Защищает принятые оригиналы и направление проекта (rules/09-platforma/META_GAMES_PLATFORM.md).
# PR: красный, если тронут защищённый файл. Push в main: защищённые файлы автоматически возвращаются.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 300
      - name: Check protected files
        env:
          GUARD_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && format('{0}..{1}', github.event.before, github.sha)) || '' }}
        run: bash scripts/meta-games-guard.sh check
      - name: Restore protected files on main
        if: failure() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "meta-games-guard"; git config user.email "actions@github.com"
          good=""
          for c in $(git rev-list -n 300 HEAD~1); do
            sums=$(git show "$c:.github/protected/SHA256SUMS" 2>/dev/null) || continue
            git log -1 --format=%B "$c" | grep -q '^Claude-Session: https://claude.ai/\|^meta-games-guard:' || [ "$(git log -1 --format=%H "$c" -- .github/protected)" != "$c" ] || continue
            ok=1
            while read -r h f; do [ "$(git show "$c:$f" 2>/dev/null | sha256sum | cut -d' ' -f1)" = "$h" ] || { ok=0; break; }; done <<< "$sums"
            [ $ok = 1 ] && { good=$c; break; }
          done
          [ -n "$good" ] || { echo "::error::Не найден исправный коммит для восстановления"; exit 1; }
          git show "$good:.github/protected/paths.txt" | grep -v '^\s*#' | sed '/^\s*$/d' | while read -r p; do
            git rm -rq --ignore-unmatch -- "$p"; git checkout "$good" -- "$p"; done
          git checkout "$good" -- .github/protected
          GUARD_RANGE="" bash scripts/meta-games-guard.sh check || echo "::warning::Обязательные ссылки в AGENTS.md/CLAUDE.md/chatgpt-autotask.md пропали — их вернёт проверка Claude"
          git add -A && git commit -m "meta-games-guard: вернул защищённые файлы к $good (правило rules/09-platforma/META_GAMES_PLATFORM.md)" && git push
