name: Meta6 Live Delivery Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meta6-live-delivery
  cancel-in-progress: true

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Russian baseline to be live
        shell: bash
        run: |
          set -euo pipefail
          URL="https://mpaykin1.github.io/meta6/"
          for attempt in $(seq 1 40); do
            BODY="$(curl -fLsS --max-time 20 "$URL" 2>/dev/null || true)"
            if printf '%s' "$BODY" | grep -Fq 'Цепочка: Meta6'; then
              echo "LIVE_OK $URL"
              break
            fi
            if [ "$attempt" -eq 40 ]; then echo "::error::Russian Meta6 public URL did not become live."; exit 1; fi
            echo "Waiting for Pages deployment ($attempt/40)..."
            sleep 10
          done

      - name: Wait for English variant to be live
        shell: bash
        run: |
          set -euo pipefail
          URL="https://mpaykin1.github.io/meta6/en/"
          for attempt in $(seq 1 40); do
            BODY="$(curl -fLsS --max-time 20 "$URL" 2>/dev/null || true)"
            if printf '%s' "$BODY" | grep -Fq 'Chain Reaction: Meta6 EN'; then
              echo "LIVE_OK $URL"
              break
            fi
            if [ "$attempt" -eq 40 ]; then echo "::error::English Meta6 public URL returned 404/stale content or lacked the expected marker."; exit 1; fi
            echo "Waiting for English Pages deployment ($attempt/40)..."
            sleep 10
          done

      - name: Release evidence
        run: |
          echo "SOURCE_SHA=${GITHUB_SHA}"
          echo "RUSSIAN_URL=https://mpaykin1.github.io/meta6/"
          echo "ENGLISH_URL=https://mpaykin1.github.io/meta6/en/"
          echo "STATUS=LIVE_VERIFIED"
