name: Meta6 Live Delivery Gate

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Require successful GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "::error::GitHub Pages deployment did not succeed; public links are not releasable."
            exit 1
          fi

      - name: Verify Russian baseline is live
        shell: bash
        run: |
          set -euo pipefail
          URL="https://mpaykin1.github.io/meta6/"
          for attempt in $(seq 1 30); do
            BODY="$(curl -fLsS --max-time 20 "$URL" 2>/dev/null || true)"
            if printf '%s' "$BODY" | grep -Fq 'Chain Reaction: Meta6'; then
              echo "LIVE_OK $URL"
              exit 0
            fi
            echo "Waiting for Russian baseline deployment ($attempt/30)..."
            sleep 10
          done
          echo "::error::Russian Meta6 public URL did not become live with the expected marker."
          exit 1

      - name: Verify English variant is live
        shell: bash
        run: |
          set -euo pipefail
          URL="https://mpaykin1.github.io/meta6/en/"
          for attempt in $(seq 1 30); do
            BODY="$(curl -fLsS --max-time 20 "$URL" 2>/dev/null || true)"
            if printf '%s' "$BODY" | grep -Fq 'Chain Reaction: Meta6 EN'; then
              echo "LIVE_OK $URL"
              exit 0
            fi
            echo "Waiting for English deployment ($attempt/30)..."
            sleep 10
          done
          echo "::error::English Meta6 public URL returned 404/stale content or lacked the expected marker."
          exit 1

      - name: Delivery contract
        run: |
          echo "Public-link release rule:"
          echo "1. repository file exists"
          echo "2. GitHub Pages deployment succeeds"
          echo "3. public URL returns HTTP 200"
          echo "4. expected build marker is present"
          echo "Only then may the link be reported as ready."
