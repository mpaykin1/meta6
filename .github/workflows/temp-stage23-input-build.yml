name: TEMP Stage23 input watchdog rebuild
on:
  push:
    branches: ['ai/chatgpt/stage23-input-watchdog']
    paths: ['.github/workflows/temp-stage23-input-build.yml']
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/chatgpt/stage23-input-watchdog
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild exact standalone with pinned dependencies
        working-directory: three-worlds-game/tools
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: All pure Node regression tests
        run: node --test three-worlds-game/tests/*.test.mjs
      - name: Commit built index.html to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add three-worlds-game/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(three-worlds): regenerate offline input watchdog'
            git push origin HEAD:refs/heads/ai/chatgpt/stage23-input-watchdog
          fi
