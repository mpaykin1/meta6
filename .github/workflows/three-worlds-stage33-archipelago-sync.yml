name: Temporary Ash Archipelago Standalone Sync
on:
  push:
    branches: ['ai/chatgpt/stage33-ash-archipelago']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pinned build toolchain
        working-directory: three-worlds-game/tools
        run: npm ci --no-audit --no-fund
      - name: Validate real voxel Ash archipelago
        run: node --test three-worlds-game/tests/accepted/ash-archipelago.test.mjs
      - name: Regenerate one-file standalone
        working-directory: three-worlds-game/tools
        run: npm run build
      - name: Save exact source-backed game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add three-worlds-game/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(three-worlds): Ash archipelago merged standalone'
            git push origin HEAD:ai/chatgpt/stage33-ash-archipelago
          fi
