name: Temporary Stage29 Red-First and Offline Rebuild
on:
  push:
    branches: ['ai/chatgpt/stage29-deep-camera']
permissions:
  contents: write
jobs:
  original-red:
    if: github.event.head_commit.message != 'build(three-worlds): reproducible water dive standalone'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned original game builder
        working-directory: three-worlds-game/tools
        run: npm ci --no-audit --no-fund
      - name: Reconstruct exact accepted main without camera fix
        run: git show 2633c75697fbec24f7e15fa52bba39d3fd32e430:three-worlds-game/index.source.html > three-worlds-game/index.source.html
      - name: Build baseline standalone
        working-directory: three-worlds-game/tools
        run: npm run build
      - name: Install pinned Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: RED first — unchanged main must fail camera under sea assertion
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          set +e
          node three-worlds-game/tests/owner-2114-water-entry-browser.mjs > /tmp/water-red.log 2>&1
          status=$?
          set -e
          if test "$status" -eq 0; then
            echo "RED_CONTROL_FAILED: unchanged accepted main unexpectedly passed"
            exit 1
          fi
          grep -F 'camera remained above surface at genuine mid-depth' /tmp/water-red.log
          echo "RED_CONTROL_VERIFIED"
  stage29-builder:
    needs: original-red
    if: github.event.head_commit.message != 'build(three-worlds): reproducible water dive standalone'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned dependencies
        working-directory: three-worlds-game/tools
        run: npm ci --no-audit --no-fund
      - name: Rebuild source-backed standalone
        working-directory: three-worlds-game/tools
        run: npm run build
      - name: Short pure Node immersion tests
        run: node --test three-worlds-game/tests/water-dive-camera.test.mjs
      - name: Commit built standalone to isolated PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add three-worlds-game/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(three-worlds): reproducible water dive standalone'
            git push origin HEAD:ai/chatgpt/stage29-deep-camera
          fi
