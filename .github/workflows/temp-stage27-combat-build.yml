name: TEMP Stage27 owner combat facing standalone build
on:
  push:
    branches: ['ai/chatgpt/stage27-combat-facing']
    paths: ['.github/workflows/temp-stage27-combat-build.yml']
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/chatgpt/stage27-combat-facing
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Original standalone pinned build
        working-directory: three-worlds-game/tools
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Full Node tests and owner §21.18 600-step golden
        run: node --test three-worlds-game/tests/*.test.mjs
      - name: Commit exact rebuilt game on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add three-worlds-game/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(three-worlds): offline owner-independent combat facing'
            git push origin HEAD:refs/heads/ai/chatgpt/stage27-combat-facing
          fi
