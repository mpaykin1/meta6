name: TEMP stage22 standalone shore source rebuild
on:
  push:
    branches: ['ai/chatgpt/stage22-water-entry']
    paths: ['.github/workflows/temp-stage22-build.yml']
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/chatgpt/stage22-water-entry
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          cd three-worlds-game/tools
          npm ci --no-audit --no-fund
          npm run build
      - run: node --test three-worlds-game/tests/*.test.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add three-worlds-game/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(three-worlds): rebuild original shore seam fix offline'
            git push origin HEAD:refs/heads/ai/chatgpt/stage22-water-entry
          fi

# stage22 integrated source rebuild rerun
