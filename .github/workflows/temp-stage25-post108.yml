name: TEMP Stage25 post-108 rebuild
on:
  push:
    branches: ['ai/chatgpt/stage25-approved-guest-roster']
    paths: ['.github/workflows/temp-stage25-post108.yml']
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/chatgpt/stage25-approved-guest-roster
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pinned standalone build
        working-directory: three-worlds-game/tools
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Node regression
        run: node --test three-worlds-game/tests/*.test.mjs
      - name: Commit only if standalone was updated
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add three-worlds-game/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(three-worlds): regenerate original guest after main #108'
            git push origin HEAD:refs/heads/ai/chatgpt/stage25-approved-guest-roster
          fi
