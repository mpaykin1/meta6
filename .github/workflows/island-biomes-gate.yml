name: Island Sumerek Biomes Browser Gate
on:
  pull_request:
    paths:
      - 'island-sumerek-biomes/**'
      - '.github/workflows/island-biomes-gate.yml'
      - '!**/play/**'
  push:
    branches: [main]
    paths:
      - 'island-sumerek-biomes/**'
      - '.github/workflows/island-biomes-gate.yml'
      - '!**/play/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check deterministic generation and module syntax
        run: |
          node island-sumerek-biomes/tests/test-seeds.cjs
          node island-sumerek-biomes/tests/check-module.cjs
      - name: Install browser smoke dependencies
        run: python3 -m pip install --quiet playwright pillow
      - name: Desktop and mobile Three.js Chrome WebGL smoke
        run: python3 island-sumerek-biomes/tests/browser-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: island-biomes-browser-evidence
          path: island-sumerek-biomes/evidence/
          if-no-files-found: warn
      - name: Verify permanent GitHub Pages game route after publish
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          url='https://mpaykin1.github.io/meta6/island-sumerek-biomes/'
          for n in $(seq 1 60); do
            if curl -fLsS --max-time 20 "$url" -o /tmp/island-live.html 2>/dev/null &&
               grep -Fq 'const BIOME_DEFS' /tmp/island-live.html &&
               grep -Fq 'addAnimated3DCharacter' /tmp/island-live.html; then
              echo "ISLAND_BIOMES_PERMANENT_LIVE=PASS"
              echo "GAME_URL=$url"
              echo "OWNER_PASS_PENDING=true"
              exit 0
            fi
            sleep 6
          done
          echo '::error::Permanent Pages route not yet serving exact biomes game'
          exit 1
