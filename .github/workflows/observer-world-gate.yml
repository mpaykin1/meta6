name: Observer World Live Gate

on:
  push:
    branches: [main]
    paths:
      - 'observer-world/**'
      - '.github/workflows/observer-world-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observer-world-live-gate
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check embedded JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("observer-world/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script>(.*?)</script>", html, re.S)
          if not blocks:
              raise SystemExit("No inline script found")
          Path("/tmp/observer-world.js").write_text("\n".join(blocks), encoding="utf-8")
          PY
          node --check /tmp/observer-world.js
          grep -Fq 'function drawActivity' observer-world/index.html
          grep -Fq 'function drawGlyph' observer-world/index.html
          grep -Fq 'NEXT_ACTION' observer-world/index.html
          grep -Fq 'inspectModal' observer-world/index.html
          grep -Fq 'function openInspect' observer-world/index.html

      - name: Verify canonical old Meta6 remains present
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          grep -Fq 'Цепочка: Meta6' index.html

      - name: Wait for Observer World to be live
        shell: bash
        run: |
          set -euo pipefail
          URL="https://mpaykin1.github.io/meta6/observer-world/"
          for attempt in $(seq 1 40); do
            BODY="$(curl -fLsS --max-time 20 "$URL" 2>/dev/null || true)"
            if printf '%s' "$BODY" | grep -Fq 'ЦЕПОЧКА · НАБЛЮДАТЕЛИ' \
              && printf '%s' "$BODY" | grep -Fq 'Институт исторических наблюдений' \
              && printf '%s' "$BODY" | grep -Fq 'Наблюдатель погиб' \
              && printf '%s' "$BODY" | grep -Fq 'function drawActivity' \
              && printf '%s' "$BODY" | grep -Fq 'function drawGlyph' \
              && printf '%s' "$BODY" | grep -Fq 'NEXT_ACTION' \
              && printf '%s' "$BODY" | grep -Fq 'inspectModal'; then
              echo "LIVE_OK $URL"
              exit 0
            fi
            echo "Waiting for Observer World Pages deployment ($attempt/40)..."
            sleep 10
          done
          echo "::error::Observer World public URL did not expose the expected build."
          exit 1

      - name: Release evidence
        run: |
          echo "SOURCE_SHA=${GITHUB_SHA}"
          echo "OBSERVER_WORLD_URL=https://mpaykin1.github.io/meta6/observer-world/"
          echo "STATUS=LIVE_VERIFIED"
