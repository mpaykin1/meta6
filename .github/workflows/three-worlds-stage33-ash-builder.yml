name: Temporary Stage33 Ash island source build
on:
  push:
    branches: ['ai/chatgpt/stage33-ash-island-original-population']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked builder
        working-directory: three-worlds-game/tools
        run: npm ci --no-audit --no-fund
      - name: Golden original world NPC and weapons tests
        run: |
          node --test three-worlds-game/tests/accepted/ash-original-island-population.test.mjs three-worlds-game/tests/owner-life-rift-mobile.test.mjs
      - name: Rebuild offline full game
        working-directory: three-worlds-game/tools
        run: npm run build
      - name: Publish standalone artifact to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add three-worlds-game/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(three-worlds): original Ash island nomad standalone'
            git push origin HEAD:ai/chatgpt/stage33-ash-island-original-population
          fi
