name: Temporary Stage33 Ash archipelago standalone
on:
  push:
    branches: ['ai/chatgpt/stage33-ash-archipelago']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned dependency lock
        working-directory: three-worlds-game/tools
        run: npm ci --no-audit --no-fund
      - name: Test isolated 3-island original population
        run: node --test three-worlds-game/tests/accepted/ash-archipelago.test.mjs
      - name: Build standalone file
        working-directory: three-worlds-game/tools
        run: npm run build
      - name: Commit source-backed offline game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add three-worlds-game/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(three-worlds): original Ash archipelago standalone'
            git push origin HEAD:ai/chatgpt/stage33-ash-archipelago
          fi
