name: Temporary guest+rain standalone final build
on:
  push:
    branches: ['ai/chatgpt/audit044-guest-contract']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked builder
        working-directory: three-worlds-game/tools
        run: npm ci --no-audit --no-fund
      - name: Short canonical quest tests
        run: node --test three-worlds-game/tests/rift-story.test.mjs three-worlds-game/tests/accepted/visitor-arc.test.mjs
      - name: Build source-backed standalone
        working-directory: three-worlds-game/tools
        run: npm run build
      - name: Commit game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add three-worlds-game/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(three-worlds): final guest, Island rain and water standalone'
            git push origin HEAD:ai/chatgpt/audit044-guest-contract
          fi
