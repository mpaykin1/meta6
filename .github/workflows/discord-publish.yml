name: Discord — Meta Games

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Текст объявления для Discord'
        required: true
        type: string
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'discord/announcements/current.json'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Read announcement on push
        if: github.event_name == 'push'
        uses: actions/checkout@v4
      - name: Prepare illustrated newspaper
        if: github.event_name == 'push'
        run: |
          if python3 -c 'import json; exit(0 if json.load(open("discord/announcements/current.json")).get("poster") == "king-ash-2" else 1)'; then
            python3 -m pip install --quiet pillow
            python3 discord/make_poster.py /tmp/king-ash-news-2.png
          fi
      - name: Publish announcement to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MESSAGE: ${{ inputs.message }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import uuid
          import urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "")
          if not webhook:
              raise SystemExit("Missing DISCORD_WEBHOOK_URL secret")

          event = os.environ.get("EVENT_NAME")
          embeds = []
          poster = False
          poster_url = ""
          if event == "push":
              with open("discord/announcements/current.json", encoding="utf-8") as f:
                  news = json.load(f)
              content = str(news.get("content", "")).strip()
              embeds = news.get("embeds", [])
              poster = news.get("poster") == "king-ash-2" or bool(news.get("poster_url"))
              poster_url = news.get("poster_url", "")
              if not isinstance(embeds, list) or len(embeds) > 1:
                  raise SystemExit("Expected zero or one Discord embed")
          elif event == "release":
              title = os.environ.get("RELEASE_NAME", "") or "Новый выпуск"
              url = os.environ.get("RELEASE_URL", "")
              content = f"🎮 **{title}**\n{url}"
          else:
              content = os.environ.get("MANUAL_MESSAGE", "").strip()
          if not content and not embeds:
              raise SystemExit("Message is empty")

          payload = {
              "username": "META GAMES",
              "content": content[:2000],
              "embeds": embeds,
              "allowed_mentions": {"parse": []}
          }

          if poster:
              name = "king-ash-news-3.png" if poster_url else "king-ash-news-2.png"
              payload["embeds"][0]["image"] = {"url": "attachment://" + name}
              payload["attachments"] = [{"id": 0, "filename": name}]
              boundary = "----MetaGames" + uuid.uuid4().hex
              def part(name, content_type, data, filename=None):
                  disposition = f'form-data; name="{name}"'
                  if filename:
                      disposition += f'; filename="{filename}"'
                  head = (
                      f"--{boundary}\r\n"
                      f"Content-Disposition: {disposition}\r\n"
                      f"Content-Type: {content_type}\r\n\r\n"
                  ).encode("utf-8")
                  return head + data + b"\r\n"
              if poster_url:
                  with urllib.request.urlopen(urllib.request.Request(poster_url,headers={"User-Agent":"Mozilla/5.0"}),timeout=25) as f:
                      art = f.read()
              else:
                  with open("/tmp/king-ash-news-2.png", "rb") as f:
                      art = f.read()
              body = part("payload_json", "application/json", json.dumps(payload, ensure_ascii=False).encode("utf-8"))
              body += part("files[0]", "image/png", art, name)
              body += f"--{boundary}--\r\n".encode("ascii")
              content_type = "multipart/form-data; boundary=" + boundary
          else:
              body = json.dumps(payload,ensure_ascii=False).encode("utf-8")
              content_type = "application/json"

          req = urllib.request.Request(
              webhook,
              data=body,
              headers={"Content-Type": content_type, "User-Agent": "MetaGames-GitHubActions/1.0"},
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord status {response.status}")
          PY
