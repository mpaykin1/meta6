name: Discord — Meta Games

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Текст объявления для Discord'
        required: true
        type: string
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'discord/announcements/current.json'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Read announcement on push
        if: github.event_name == 'push'
        uses: actions/checkout@v4
      - name: Publish announcement to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MESSAGE: ${{ inputs.message }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "")
          if not webhook:
              raise SystemExit("Missing DISCORD_WEBHOOK_URL secret")

          event = os.environ.get("EVENT_NAME")
          embeds = []
          if event == "push":
              with open("discord/announcements/current.json", encoding="utf-8") as f:
                  news = json.load(f)
              content = str(news.get("content", "")).strip()
              embeds = news.get("embeds", [])
              if not isinstance(embeds, list) or len(embeds) > 1:
                  raise SystemExit("Expected zero or one Discord embed")
          elif event == "release":
              title = os.environ.get("RELEASE_NAME", "") or "Новый выпуск"
              url = os.environ.get("RELEASE_URL", "")
              content = f"🎮 **{title}**\n{url}"
          else:
              content = os.environ.get("MANUAL_MESSAGE", "").strip()
          if not content and not embeds:
              raise SystemExit("Message is empty")

          payload = json.dumps({
              "username": "META GAMES",
              "content": content[:2000],
              "embeds": embeds,
              "allowed_mentions": {"parse": []}
          }, ensure_ascii=False).encode("utf-8")

          req = urllib.request.Request(
              webhook,
              data=payload,
              headers={"Content-Type": "application/json", "User-Agent": "MetaGames-GitHubActions/1.0"},
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord status {response.status}")
          PY
