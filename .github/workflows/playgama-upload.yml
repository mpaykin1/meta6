# Uploads a Playgama build archive to the presigned URL from the developer console.
# Used when the agent's own network cannot reach the Playgama S3 bucket.
# The URL is write-only, for this one archive, and expires within an hour.
name: playgama-upload
on:
  push:
    paths: ['playgama-upload/upload-url.txt']
jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PUT archive
        run: |
          ls -l playgama-upload/archive.zip
          code=$(curl -sS -o resp.txt -w '%{http_code}' -T playgama-upload/archive.zip -H 'Content-Type: application/zip' "$(tr -d '\r\n' < playgama-upload/upload-url.txt)")
          echo "HTTP $code"; cat resp.txt || true
          test "$code" = 200
