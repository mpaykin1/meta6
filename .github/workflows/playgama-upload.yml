# Uploads Playgama build archives to presigned URLs from the developer console.
# Used when the agent's own network cannot reach the Playgama S3 bucket.
# For each playgama-upload/<name>.url the matching <name>.zip is PUT (legacy: upload-url.txt + archive.zip).
# The URLs are write-only, for one archive each, and expire within an hour.
name: playgama-upload
on:
  push:
    paths: ['playgama-upload/**']
jobs:
  put:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # ТЕЛЕФОН БЕЗ ТОРМОЗОВ (владелец, 24.11.2026): сборка с FAIL на Playgama не уходит.
      - name: Телефон без тормозов — строгий замер каждой сборки
        run: |
          set -e
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          bash scripts/telefon-bez-tormozov-selftest.sh
          for z in playgama-upload/*.zip; do
            [ -f "$z" ] || continue
            d=$(mktemp -d); unzip -q "$z" -d "$d"
            g=$(find "$d" -name index.html | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
            echo "::group::$z"; rc=0; node scripts/telefon-bez-tormozov.mjs "$g" || rc=$?; echo "::endgroup::"
            [ $rc -eq 2 ] && echo "::warning::$z: бот не увидел кадра WebGL — замер пропущен"
            [ $rc -eq 1 ] && { echo "::error::$z: ТЕЛЕФОН БЕЗ ТОРМОЗОВ FAIL — не загружаю на Playgama"; exit 1; }
            true
          done
      - name: PUT archives
        run: |
          set -e
          cd playgama-upload
          [ -f upload-url.txt ] && [ -f archive.zip ] && cp upload-url.txt archive.url || true
          for u in *.url; do
            [ -f "$u" ] || continue
            z="${u%.url}.zip"; ls -l "$z"
            code=$(curl -sS -o resp.txt -w '%{http_code}' -T "$z" -H 'Content-Type: application/zip' "$(tr -d '\r\n' < "$u")")
            echo "$z HTTP $code"; cat resp.txt || true
            test "$code" = 200
          done
