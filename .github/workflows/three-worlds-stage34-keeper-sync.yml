name: Temporary Keeper source-backed main sync
on:
  push:
    branches: ['ai/chatgpt/audit044-guest-contract']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Existing locked builder
        working-directory: three-worlds-game/tools
        run: npm ci --no-audit --no-fund
      - name: Short canonical dialogue and bubble guard tests
        run: node --test three-worlds-game/tests/rift-story.test.mjs three-worlds-game/tests/keeper-bubble-position.test.mjs
      - name: Build standalone
        working-directory: three-worlds-game/tools
        run: npm run build
      - name: Commit source-backed offline bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add three-worlds-game/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(three-worlds): current Keeper bubble and original guest standalone'
            git push origin HEAD:ai/chatgpt/audit044-guest-contract
          fi
