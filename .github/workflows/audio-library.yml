name: Build CC0 OGG audio library
on:
  pull_request:
    branches: [main]
    paths:
      - audio/build_audio.py
      - audio/check_audio.mjs
      - .github/workflows/audio-library.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio tools
        run: |
          python -m pip install --disable-pip-version-check numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Inventory existing audio and build original and CC0 OGG
        run: python audio/build_audio.py
      - name: Validate complete library
        run: node audio/check_audio.mjs
      - name: Commit generated OGG, manifest, credits, coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/library audio/manifest.json audio/SOUND_NEEDS.md audio/CREDITS.md audio/EXISTING_AUDIO.md
          if ! git diff --cached --quiet; then
            git commit -m "audio: import verified CC0 OGG library and complete needs map"
            git push origin HEAD:audio-library
          fi
