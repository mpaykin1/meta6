name: Observer World EN Live Gate

on:
  push:
    branches: [main]
    paths:
      - 'observer-world-en/**'
      - '.github/workflows/observer-world-en-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observer-world-en-live-gate
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check English build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("observer-world-en/index.html").read_text(encoding="utf-8")
          if re.search(r"[А-Яа-яЁё]", html):
              raise SystemExit("Cyrillic text remains in English build")
          blocks = re.findall(r"<script>(.*?)</script>", html, re.S)
          if not blocks:
              raise SystemExit("No inline script found")
          Path("/tmp/observer-world-en.js").write_text("\n".join(blocks), encoding="utf-8")
          required = [
              "CHAIN REACTION · OBSERVERS",
              "Institute of Historical Observation",
              "Observer Killed",
              "function drawActivity",
              "function drawGlyph",
              "NEXT_ACTION",
              "inspectModal"
          ]
          for marker in required:
              if marker not in html:
                  raise SystemExit(f"Missing marker: {marker}")
          PY
          node --check /tmp/observer-world-en.js

      - name: Wait for English Observer World to be live
        shell: bash
        run: |
          set -euo pipefail
          URL="https://mpaykin1.github.io/meta6/observer-world-en/"
          for attempt in $(seq 1 40); do
            BODY="$(curl -fLsS --max-time 20 "$URL" 2>/dev/null || true)"
            if printf '%s' "$BODY" | grep -Fq 'CHAIN REACTION · OBSERVERS' \
              && printf '%s' "$BODY" | grep -Fq 'Institute of Historical Observation' \
              && printf '%s' "$BODY" | grep -Fq 'Observer Killed' \
              && printf '%s' "$BODY" | grep -Fq 'NEXT_ACTION'; then
              echo "LIVE_OK $URL"
              exit 0
            fi
            echo "Waiting for English Observer World Pages deployment ($attempt/40)..."
            sleep 10
          done
          echo "::error::English Observer World public URL did not expose the expected build."
          exit 1

      - name: Release evidence
        run: |
          echo "SOURCE_SHA=${GITHUB_SHA}"
          echo "ENGLISH_OBSERVER_WORLD_URL=https://mpaykin1.github.io/meta6/observer-world-en/"
          echo "STATUS=LIVE_VERIFIED"
