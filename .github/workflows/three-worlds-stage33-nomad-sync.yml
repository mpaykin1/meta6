name: Temporary Ash Heroes Latest Main Sync
on:
  push:
    branches: ['ai/chatgpt/stage33-ash-island-original-population']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pinned deps
        working-directory: three-worlds-game/tools
        run: npm ci --no-audit --no-fund
      - name: Existing original role and Ash island golden
        run: node --test three-worlds-game/tests/accepted/ash-original-island-population.test.mjs three-worlds-game/tests/accepted/ash-archipelago.test.mjs three-worlds-game/tests/owner-life-rift-mobile.test.mjs
      - name: Build complete standalone
        working-directory: three-worlds-game/tools
        run: npm run build
      - name: Write built HTML into feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add three-worlds-game/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(three-worlds): original Ash nomad, three islands, full world'
            git push origin HEAD:ai/chatgpt/stage33-ash-island-original-population
          fi
