name: Asset Quality
on:
  pull_request:
    paths:
      - 'abyss-glow/assets/**'
      - '!abyss-glow/assets/maw_front_v1/**'
      - '!abyss-glow/play/**'
      - 'abyss-glow/references/**'
      - 'automation/asset-quality/**'
      - '.github/workflows/abyss-asset-quality.yml'
      - '.github/workflows/abyss-release-gate.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s automation/asset-quality -p 'test_*.py' -v
      - name: Check production assets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -f abyss-glow/assets/manifest.json ]; then
            python automation/asset-quality/validate.py --root abyss-glow/assets --manifest abyss-glow/assets/manifest.json
            python automation/asset-quality/check_animation.py --manifest abyss-glow/assets/manifest.json --output asset-animation-report.json
            python automation/asset-quality/audit_pack.py --root abyss-glow/assets --manifest abyss-glow/assets/manifest.json --requirements automation/asset-quality/abyss-requirements.json --output asset-quality-audit.json
          elif [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -q '^abyss-glow/assets/'; then
              echo 'Required production asset manifest missing for changed source assets' >&2
              exit 1
            fi
            echo 'Asset coverage N/A: source assets unchanged; production manifest not installed'
          else
            echo 'Required source manifest absent and changed-asset scope unknown' >&2
            exit 1
          fi

      - name: Compare reference sprites
        run: |
          python automation/asset-quality/compare_reference_batch.py \
            --root abyss-glow/assets \
            --references abyss-glow/references \
            --output asset-visual-report.json

      - name: Report requirements verification status
        if: always()
        run: |
          python automation/asset-quality/requirements_status.py \
            --requirements automation/asset-quality/abyss-requirements.json \
            --output asset-requirements-status.json

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abyss-asset-quality-evidence
          path: |
            asset-quality-audit.json
            asset-animation-report.json
            asset-visual-report.json
            asset-requirements-status.json
          if-no-files-found: warn
