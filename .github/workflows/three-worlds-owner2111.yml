name: Three Worlds §21.11 Island voxel phone canon
on:
  push:
    branches: [ai/chatgpt/stage15-island-voxel-phone-canon]
permissions:
  contents: write
jobs:
  voxel-phone:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/chatgpt/stage15-island-voxel-phone-canon
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install original game bundle dependencies
        working-directory: three-worlds-game/tools
        run: npm ci --no-audit --no-fund
      - name: Rebuild standalone with shared voxel and invisible native phone touch
        working-directory: three-worlds-game/tools
        run: npm run build
      - name: Test original Island goldens and integer voxel/culling short gates
        run: |
          set -euo pipefail
          mkdir -p three-worlds-game/evidence
          node --test three-worlds-game/tests/*.test.mjs | tee three-worlds-game/evidence/owner2111-voxel-phone.txt
      - name: Install headless mobile browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Genuine phone touch and owner full game regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          node three-worlds-game/tests/owner042-044-browser.mjs
      - name: Commit rebuilt standalone and code evidence only after all gates green
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add three-worlds-game/index.html three-worlds-game/evidence/owner2111-voxel-phone.txt three-worlds-game/evidence/owner042-044-code.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(stage15): owner Island voxel and invisible mobile native touch'
          git fetch origin ai/chatgpt/stage15-island-voxel-phone-canon
          git rebase origin/ai/chatgpt/stage15-island-voxel-phone-canon
          git push origin HEAD:ai/chatgpt/stage15-island-voxel-phone-canon
