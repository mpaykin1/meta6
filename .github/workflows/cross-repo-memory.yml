name: Cross-repo memory tools
on:
  pull_request:
    paths:
      - 'automation/tools/cross_repo_*.py'
      - 'automation/tools/memory_preflight.py'
      - 'automation/tools/tests/test_cross_repo_runner.py'
      - 'automation/tools/tests/test_memory_preflight*.py'
      - 'automation/tools/tests/test_cross_repo_*.py'
      - 'docs/development-memory/cross-repo/**'
      - 'docs/development-memory/events.jsonl'
      - 'automation/prompts/chatgpt-autotask.md'
      - '.github/workflows/cross-repo-memory.yml'
  push:
    branches: [main]
    paths:
      - 'automation/tools/cross_repo_*.py'
      - 'automation/tools/memory_preflight.py'
      - 'automation/tools/tests/test_memory_preflight*.py'
      - 'automation/tools/tests/test_cross_repo_*.py'
      - 'docs/development-memory/cross-repo/**'
      - 'docs/development-memory/events.jsonl'
      - 'automation/prompts/chatgpt-autotask.md'
      - '.github/workflows/cross-repo-memory.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: |
          python3 -m unittest discover -s automation/tools/tests -p 'test_cross_repo_*.py'
          python3 -m unittest discover -s automation/tools/tests -p 'test_memory_preflight*.py'
      - name: Syntax checks
        run: python3 -m py_compile automation/tools/cross_repo_inventory.py automation/tools/cross_repo_recall.py automation/tools/memory_preflight.py
      - name: Recall index deterministic regeneration
        run: |
          python3 automation/tools/cross_repo_recall.py
          python3 automation/tools/cross_repo_recall.py --check
      - name: Validate reusable component catalog
        run: python3 automation/tools/cross_repo_components.py --check
      - name: Report regression coverage gaps (non-blocking until mapped)
        run: python3 automation/tools/cross_repo_regressions.py
      - name: Report observed cross-repo coverage
        run: python3 automation/tools/cross_repo_metrics.py
      - name: Verify bounded runner plan
        run: python3 automation/tools/cross_repo_runner.py --offline --topic "ci memory smoke" --plan
      - name: Exercise offline runner end to end
        run: python3 automation/tools/cross_repo_runner.py --offline --topic "ci memory smoke"
      - name: Legacy memory integrity
        run: python3 automation/tools/compact_experience.py --check
