name: Cross-repo memory tools
on:
  pull_request:
    paths:
      - 'automation/tools/cross_repo_*.py'
      - 'automation/tools/tests/test_cross_repo_*.py'
      - 'docs/development-memory/cross-repo/**'
      - '.github/workflows/cross-repo-memory.yml'
  push:
    branches: [main]
    paths:
      - 'automation/tools/cross_repo_*.py'
      - 'automation/tools/tests/test_cross_repo_*.py'
      - 'docs/development-memory/cross-repo/**'
      - '.github/workflows/cross-repo-memory.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test recall
        run: python3 -m unittest discover -s automation/tools/tests -p 'test_cross_repo_*.py'
      - name: Check inventory script syntax
        run: python3 -m py_compile automation/tools/cross_repo_inventory.py automation/tools/cross_repo_recall.py
