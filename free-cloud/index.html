<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Server Free Cloud</title><style>body{background:#0d1725;color:#eaf3ff;font:16px system-ui;margin:0;padding:25px;max-width:750px}button,a{background:#24456b;color:white;border:1px solid #5686aa;border-radius:9px;padding:12px;display:inline-block;margin:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>World Server · Free Cloud</h1><p>Интеграционный тест: браузер, сохранение, API и переход в существующие миры.</p><a href="../underwater-world/">🌊 Подводный мир</a><a href="../observer-world-en-v7/">🌲 Наземный мир</a><p><button id="save">Сохранить событие</button><button id="check">Проверить API</button></p><pre id="out">Готов к локальному тесту. Облачные ключи не настроены.</pre><script type="module">const out=document.querySelector('#out');const api=new URLSearchParams(location.search).get('api');document.querySelector('#save').onclick=()=>{const e={kind:'world_visit',world:'hub',at:new Date().toISOString()};localStorage.setItem('ws-free-cloud-last',JSON.stringify(e));out.textContent='Локально сохранено: '+JSON.stringify(e)};document.querySelector('#check').onclick=async()=>{if(!api){out.textContent='API не подключён. Для проверки добавьте ?api=https://ВАШ-WORKER.workers.dev';return}try{const u=new URL('/health',api);if(u.protocol!=='https:')throw Error('Требуется HTTPS');const r=await fetch(u,{signal:AbortSignal.timeout(8000)});out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent='API недоступен: '+e.message}};</script></html>
