<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ABYSS Gothic Parallax Preview</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010509;touch-action:none}canvas{display:block;width:100%;height:100%}</style><canvas id="view"></canvas><script>
(()=>{'use strict';
const c=document.getElementById('view'),g=c.getContext('2d',{alpha:false});let w=0,h=0,dpr=1,t=0,raf=0,frames=0,started=performance.now(),pointer={x:.5,y:.5},drag=false,mode=0;
const layers=[{file:'gothic_far_cathedral.svg',factor:.12,opacity:.8},{file:'gothic_mid_viaduct.svg',factor:.42,opacity:.9},{file:'gothic_near_shipwreck.svg',factor:.78,opacity:.95},{file:'hero_fish.svg',factor:1,opacity:1},{file:'jaw_threat.svg',factor:1,opacity:1}];
for(const l of layers){l.img=new Image();l.ready=false;l.img.onload=()=>l.ready=true;l.img.onerror=()=>l.error=true;l.img.src='./'+l.file}
const fit=()=>{w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);g.setTransform(dpr,0,0,dpr,0,0)};addEventListener('resize',fit);fit();
const move=(x,y)=>{pointer.x=Math.min(1,Math.max(0,x/w));pointer.y=Math.min(1,Math.max(0,y/h))};
c.addEventListener('pointerdown',e=>{drag=true;mode=1;move(e.clientX,e.clientY);c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(drag)move(e.clientX,e.clientY)});
c.addEventListener('pointerup',()=>drag=false);
const draw=(time)=>{frames++;const dt=Math.min(.05,(time-t)/1000||.016);t=time;g.fillStyle='#01070d';g.fillRect(0,0,w,h);
const s=Math.max(w/390,h/844),ox=(w-390*s)/2,oy=(h-844*s)/2;
const gradient=g.createLinearGradient(0,0,0,h);gradient.addColorStop(0,'#053345');gradient.addColorStop(.45,'#031a27');gradient.addColorStop(1,'#010408');g.fillStyle=gradient;g.fillRect(0,0,w,h);
g.save();g.translate(ox,oy);g.scale(s,s);
for(let i=0;i<3;i++){const l=layers[i];if(!l.ready)continue;const px=(pointer.x-.5)*38*l.factor,py=(pointer.y-.5)*35*l.factor;g.globalAlpha=l.opacity;g.drawImage(l.img,-px,-py,390,844)}
g.globalAlpha=1;const fish=layers[3];if(fish.ready){g.save();g.translate(Math.sin(time*.0014)*13,Math.sin(time*.003)*8);g.drawImage(fish.img,0,0,390,844);g.restore()}
if(mode){const jaw=layers[4];if(jaw.ready){const a=Math.min(1,(time%7000)/1900);g.save();g.globalAlpha=Math.min(.9,a);g.translate(195,392);g.scale(.25+a*.65,.25+a*.65);g.translate(-195,-392);g.drawImage(jaw.img,0,0,390,844);g.restore()}}
g.restore();raf=requestAnimationFrame(draw)};raf=requestAnimationFrame(draw);
window.__abyssGothicPreview=()=>({ready:layers.filter(l=>l.ready).length,failed:layers.filter(l=>l.error).map(l=>l.file),mode,viewport:[w,h],frames,seconds:(performance.now()-started)/1000,source:'generated SVG preview, NOT original game'});
})();
</script></html>
