<!doctype html><meta charset="utf-8"><title>ABYSS GLOW — owner maw motion probe</title>
<style>html,body{margin:0;background:#000;color:#fde766;font:12px monospace;overflow:hidden}canvas{width:100vw;height:100vh;image-rendering:pixelated}aside{position:fixed;left:8px;top:8px}</style>
<canvas width="390" height="844" aria-label="Animated owner-source front maw evidence stand"></canvas><aside>OWNER MAW · HINGE [108,168] · LEFT/RIGHT LIGHT</aside>
<script>
/* Isolated evidence stand. The accepted abyss-glow/stand/index.html is not imported or edited. */
const c=document.querySelector('canvas'),x=c.getContext('2d');x.imageSmoothingEnabled=false;
const atlas=new Image();atlas.src='../assets/maw_front_v1/maw_front_atlas.png';
const W=217,H=289,P=[108,168],rect={upper:{body:[2,2],detail:[223,2],emissive:[665,2]},lower:{body:[2,295],detail:[223,295],emissive:[665,295]}};
let last=0,elapsed=0;
function tile(part,layer,clip){const r=rect[part][layer];if(clip){x.save();x.beginPath();x.rect(clip[0],0,clip[1],H);x.clip()}x.drawImage(atlas,r[0],r[1],W,H,0,0,W,H);if(clip)x.restore()}
function part(name,light){tile(name,'body');const facing=light<0?[0,P[0]]:[P[0],W-P[0]];tile(name,'detail',facing);tile(name,'emissive')}
function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;elapsed+=dt;const phase=(elapsed%4)/4;const open=Math.sin(Math.PI*Math.min(1,phase*2));const light=(Math.floor(elapsed/4)%2)?1:-1;
 x.setTransform(1,0,0,1,0,0);x.fillStyle='#000';x.fillRect(0,0,c.width,c.height);const s=1.6,ox=(c.width-W*s)/2,oy=170;x.translate(ox,oy);x.scale(s,s);part('upper',light);
 x.save();x.translate(P[0],P[1]+open*18);x.scale(1,1+open*.12);x.translate(-P[0],-P[1]);part('lower',light);x.restore();requestAnimationFrame(frame)}
atlas.onload=()=>requestAnimationFrame(frame);
</script>
