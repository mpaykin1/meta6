<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ASQURA — Сны и время</title><style>*{box-sizing:border-box}body{margin:0;background:#080b13;color:#e9e7d9;font:15px system-ui;overflow:hidden}canvas{display:block;touch-action:none}#panel{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(94vw,590px);background:#0b1020e8;border:1px solid #d6b67b77;padding:14px 18px;border-radius:12px;display:none;box-shadow:0 0 35px #000}#panel b{color:#f5d695}#panel p{line-height:1.5;margin:9px 0}button{border:1px solid #b6a078;background:#282c3a;color:#fff;border-radius:8px;padding:10px 15px;cursor:pointer;margin:4px}button:active{background:#75603c}#hint{position:fixed;top:10px;left:10px;color:#c7c4bd99;font:12px system-ui}#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s}</style><canvas id="c"></canvas><div id="hint">ASQURA · коснись сотрудника или лифта · WASD / стрелки</div><div id="panel"><b id="who"></b><p id="speech"></p><div id="actions"></div></div><div id="fade"></div><script>

for(let i=0;i<18;i++){let x=i*73-100;rect(x,65,52,170,"#111b2c");for(let j=0;j<8;j++)if(rand(i*31+j)>.36)rect(x+7+(j%2)*20,80+Math.floor(j/2)*36,8,14,era===2?"#26a1bd44":"#d6a56a33")}
rect(0,145,1040,420,"#222939");rect(0,555,1040,95,"#171c2a");for(let i=0;i<18;i++){line(i*70,555,i*70-30,650,"#303547");line(0,558+i*8,1040,558+i*8,"#2b3241")}

function pick(px,py){let scale=Math.min(W/1040,H/650)*1.07,x=(px-W/2)/scale+viewX,y=(py-H/2)/scale+viewY;if(x>920&&x<1030&&y>150&&y<485){elevator();return}let best=null,dist=1e9;people.forEach(p=>{let d=Math.hypot(p.x+12-x,p.y+35-y);if(d<dist){dist=d;best=p}});if(dist<85)talk(best.g);else {player.x=Math.max(40,Math.min(990,x));player.y=Math.max(270,Math.min(520,y))}}
