<script>
'use strict';

const mk=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'));return c};

/* ---------- screen: low-res pixel buffer, full screen ---------- */
let W=1,H=1,S=1,K=1,camX=0,camY=0,camTX=0,camTY=0,vign=null,grainPat=null,uiBottom=0;
function cX(v){const lo=W/2-575*.83*S,hi=595*.83*S-W/2;return lo>hi?(lo+hi)/2:clamp(v,lo,hi)}

  S=Math.max(W/720,Math.min(H/500,W/330));K=Math.max(1,Math.round(S*2.3));uiBottom=70*H/vh;

/* ---------- isometric projection and wall planes ---------- */
function P(x,y,z=0){return{x:W/2+camX+(x-y)*.83*S,y:H*.5+camY+((x+y)*.39-z)*S}}
function UP(sx,sy){const a=(sx-W/2-camX)/(.83*S),b=(sy-H*.5-camY)/(.39*S);return{x:(a+b)/2,y:(b-a)/2}}

function backT(Y0){ctx.setTransform(.83*S,.39*S,0,S,W/2+camX-.83*S*Y0,H*.5+camY+.39*S*Y0)}   // plane y=Y0 : u=x, v=-z
function sideT(X0){ctx.setTransform(.83*S,-.39*S,0,S,W/2+camX+.83*S*X0,H*.5+camY+.39*S*X0)} // plane x=X0 : u=-y, v=-z

function box(x,y,w,h,z1,top,front,side,z0=0){
  const a0=P(x+w,y,z0),b0=P(x+w,y+h,z0),c0=P(x,y+h,z0),a1=P(x+w,y,z1),b1=P(x+w,y+h,z1),c1=P(x,y+h,z1),d1=P(x,y,z1);
  poly([c0,b0,b1,c1],front);poly([a0,b0,b1,a1],side);poly([d1,a1,b1,c1],top)}
function ell(x,y,rx,ry,c){ctx.beginPath();ctx.ellipse(x,y,Math.max(1,rx),Math.max(1,ry),0,0,7);ctx.fillStyle=c;ctx.fill()}

    for(let yy=80-h+3;yy<77;yy+=4)for(let xx=x+2;xx<x+w-2;xx+=4)if(Math.random()<.27){g.fillStyle=Math.random()<.72?'#f5c76a':'#8fd0ff';g.globalAlpha=R(.45,1);g.fillRect(xx,yy,2,2);g.globalAlpha=1}

    r(0,9+u+la,2,6,Y);r(0,11+u+la,2,1,cs.band);r(0,15+u+la,2,1,BK);r(12,9+u+ra,2,6,YD);r(12,15+u+ra,2,1,BK);

      if(o.sleep||o.blink){r(5,4+hu,1,1,'#55606c');r(8,4+hu,1,1,'#55606c')}else{r(5,4+hu,1,1,'#e9eef6');r(8,4+hu,1,1,'#e9eef6')}
      if(cs.glasses){r(4,4+hu,6,1,'#5d6472')}

  }
  const LACE='#f6f1e6',gown=cs&&cs.gown;
  const TOP=cs?(cs.coat||cs.gown):(c.top||SHIRT),TOPD=cs?(cs.coatD||cs.gownD):(c.topD||SHIRT_D);
  /* royal mantle behind the body */
  if(cs&&cs.mantle&&!bk){const mh=o.sit?9:13;r(0,9+u,14,mh,cs.mantleD);r(1,9+u,12,mh-1,cs.mantle);r(1,9+u+mh-2,12,1,'#f3f0ea')}

  if(cs&&cs.fan&&!bk&&!o.mug){const fl=Math.round(Math.sin((o.t||T)*6+(o.seed||0)));r(12,11+u+ra+fl,3,3,'#f4efe6');r(13,10+u+ra+fl,3,1,'#f4efe6');r(12,13+u+ra+fl,1,1,'#c9bfa8');r(14,12+u+ra+fl,1,1,'#e3a4b0')}

PG.load=()=>{try{PG.best=Math.max(PG.best,+localStorage.getItem(SAVE_KEY+'_best')||1)}catch(e){}const s=PG.loadRaw();if(!s||!s.day)return false;
  day=Math.max(1,s.day|0);PG.money=s.money|0;PG.mood=clamp(+s.mood||80,40,100);PG.upg=s.upg||{};PG.best=Math.max(PG.best,s.best||day);PG.won=s.won|0;PG.applySpd();PG.dayMax=PG.dayT=PG.dayLen();PG.hk='';updTask();return true};

/* ---------- события: общие + свои у каждой эпохи ---------- */
PG.banner=(head,txt)=>{$('evk').textContent=head;$('evt').textContent=txt;const b=$('evb');b.classList.remove('hide','pop');void b.offsetWidth;b.classList.add('pop')};
PG.clearEvt=()=>{const e=PG.E;PG.E=null;$('evb').classList.add('hide');if(e&&e.k==='tank')TANKS[e.i].ag=0;workers.forEach(w=>{if(w.need==='fix')w.need=null;w.fixK=null})};
PG.evStart=()=>{
  const pool=['inspect','treat','rush'];if(!ARCH.on){pool.push('blackout');if(LV===0)pool.push('printer','printer');if(LV<0)pool.push('silence','silence');if(LV>0)pool.push('tank','tank')}
  const k=pick(pool),L=LEAD();
  if(k==='inspect'){PG.E={k,t:20,dur:20};PG.banner('ПРОВЕРКА ×2','всё за задачи вдвойне, но настроение падает быстрее');say(L,LV<0?'Его Величество наблюдает! Покажите усердие.':LV>0?'Комиссия из 2100 года! Работаем образцово.':'Проверка из головного офиса! Работаем на все сто.',3.5);sfx.alarm()}
  else if(k==='treat'){PG.E={k,t:3.5,dur:3.5};PG.mood=Math.min(100,PG.mood+15);const tx=ARCH.on?'Архивариус принёс печенье!':LV<0?'Королевские пирожные для всех!':LV>0?'Синтез-торт из принтера еды!':'Пицца для всей команды!';PG.banner('УГОЩЕНИЕ','+15 к настроению');say(L,tx,3);sfx.sparkle();workers.forEach(w=>{if(!w.gone&&!w.inLift){w.hopT=.4;PG.float(w.sx,w.hy-8*K,'♥','#ff8fb0')}})}
  else if(k==='rush'){PG.E={k,t:3.5,dur:3.5};PG.banner('АВРАЛ!','сразу несколько задач');say(L,'Аврал! Все за работу!',2.5);sfx.alarm();const n=2+(day>6?1:0);for(let i=0;i<n;i++)setTimeout(()=>{if(PG.active())spawn(MIS[mi].k)},i*400)}
  else if(k==='blackout'){PG.E={k,t:10,dur:10};PG.banner('СВЕТ ПОГАС','работа почти стоит · подождите');say(L,LV<0?'Сквозняк задул все свечи!':LV>0?'Сбой реактора! Аварийное питание...':'Опять выбило пробки!',3);sfx.thunk();sfx.rumble(1.2)}
  else if(k==='printer'){PG.E={k,t:0,dur:0,retry:0};PG.banner('ПРИНТЕР СЛОМАН','нажми на того, у кого гаечный ключ · работа вдвое медленнее');say(L,'Принтер задымился! Кто-нибудь, почините!',3);sfx.crash();PG.assignFix()}
  else if(k==='silence'){PG.E={k,t:8,dur:8,bad:0};PG.banner('ТИШИНА!','король думает · ничего не нажимай');say(KING,'Тишина! Король размышляет.',3);sfx.bow()}
  else if(k==='tank'){const i=Math.random()*3|0;PG.E={k,t:14,dur:14,i,sent:null};PG.banner('КОЛБА ТРЕЩИТ!','нажми на мигающую колбу, пока монстр не вырвался');say(PROF,'Образец в колбе беснуется! Срочно туда!',3);sfx.alarm();const tp=P(TANKS[i].x,TANKS[i].y,70);camTX=cX(camX-(tp.x-W/2));camTY=cY(camY-(tp.y-H*.5))}
  PG.hk=''};
PG.assignFix=()=>{const free=workers.filter(w=>!w.gone&&!w.inLift&&!w.need&&(w.state==='idle'||w.state==='sit'||(w.state==='walk'&&(w.next==='idle'||w.next==='sit'))));if(!free.length)return false;const w=pick(free);w.need='fix';if(w.state==='walk'){w.state='idle';w.vx=w.vy=0}w.wait=99;sfx.ping();return true};
PG.evUpd=dt=>{
  const e=PG.E;
  if(!e){PG.nextE-=dt;if(PG.nextE<=0){PG.nextE=R(28,50)/(1+.05*(day-1));PG.evStart()}return}
  if(e.k==='printer'){PG.puffT-=dt;if(PG.puffT<=0){PG.puffT=.18;puff(P(262,40,34),'#5a5f6a')}
    if(!workers.some(w=>w.need==='fix'||w.fixK==='printer')){e.retry-=dt;if(e.retry<=0){e.retry=1;PG.assignFix()}}}
  if(e.k==='tank'){TANKS[e.i].ag=1;e.ring=(e.ring||0)-dt;if(e.ring<=0&&!e.sent){e.ring=1.4;sfx.alarm()}}
  if(e.dur){e.t-=dt;$('evtime').textContent=Math.max(0,Math.ceil(e.t));if(e.t<=0)PG.evEnd(e.k!=='tank')}else $('evtime').textContent='!'};
PG.evEnd=ok=>{const e=PG.E;if(!e)return;
  if(e.k==='silence'&&!e.bad){PG.mood=Math.min(100,PG.mood+6);PG.money+=10;say(KING,'Благодарю за тишину. Казна жалует 10 ЗП.',3);sfx.coin()}
  if(e.k==='tank'&&!ok){SHAKE=1.3;sfx.crash();PG.mood=Math.max(1,PG.mood-20);const tp=P(TANKS[e.i].x,TANKS[e.i].y,60);for(let i=0;i<14;i++)puff({x:tp.x+R(-20,20)*S,y:tp.y},'#7dffb2');
    say(PROF,'Монстр выбрался, всех напугал и залез обратно. Двое в обмороке!',4);
    workers.filter(w=>!w.gone&&!w.inLift&&w.state!=='sleep').sort(()=>Math.random()-.5).slice(0,2).forEach(w=>{w.need=null;w.fixK=null;if(w.state==='sit'){w.state='sleep';w.zT=0}else go(w,SEAT(w.i).x,SEAT(w.i).y,'sleep')})}
  PG.clearEvt();PG.hk=''};
PG.tapBlock=w=>{const e=PG.E;if(!e||e.k!=='silence')return false;e.bad=1;PG.mood=Math.max(0,PG.mood-8);say(KING,'Тсс! Я же сказал: ТИШИНА!',2.2);sfx.locked();PG.float(w.sx,w.hy-8*K,'-8','#ff6a6a');SHAKE=Math.max(SHAKE,.25);return true};
PG.goFix=w=>{w.need=null;w.fixK='printer';sfx.ok();say(w,pick(['Сейчас починю!','Где тут кнопка?','Пну его — заработает!']),2);
  const c=[[262,74],[226,40],[262,4]].find(p=>!hit(p[0],p[1]))||[w.x,w.y];go(w,c[0],c[1],'fix')};
PG.tap=b=>{const e=PG.E;if(!e||e.k!=='tank'||LV<=0||ELEV.ph!=='idle')return false;const tk=TANKS[e.i],c=P(tk.x,tk.y,70);
  if(Math.abs(b.x-c.x)>32*S||b.y<c.y-70*S||b.y>c.y+50*S)return false;if(e.sent){sfx.tap();return true}
  const free=workers.filter(w=>!w.gone&&!w.inLift&&w.state!=='fixing');if(!free.length)return true;
  const w=free.reduce((a,o)=>Math.hypot(o.x-tk.x,o.y-tk.y)<Math.hypot(a.x-tk.x,a.y-tk.y)?o:a);
  w.need=null;w.fixK='tank';e.sent=w;sfx.ok();say(w,'Держу колбу! Успокойся, малыш...',2.2);go(w,tk.x+R(-8,8),-166,'fix');return true};
PG.fixUpd=(w,dt)=>{w.prog+=dt/3.2*(1+.25*PG.lvl('pc'));

  if(Math.random()<dt*5&&AU.ctx)tone(R(900,1500),.04,'square',.012);
  if(w.prog>=1){w.state='idle';w.wait=R(1,3);w.hopT=.4;w.back=false;PG.fixDone(w)}};

  if(e&&((e.k==='printer'&&k==='printer')||(e.k==='tank'&&e.sent===w))){PG.money+=12;PG.dayEarn+=12;PG.mood=Math.min(100,PG.mood+6);PG.float(w.sx,w.hy-10*K,'+12','#7dffb2');sparks(w);sfx.mission();

  if(e&&e.k==='tank'&&LV>0){const tk=TANKS[e.i],c=P(tk.x,tk.y,70),a=.5+.5*Math.sin(T*9);ctx.globalCompositeOperation='lighter';ctx.strokeStyle=`rgba(255,80,90,${.35+.45*a})`;ctx.lineWidth=Math.max(1,1.6*S);
    ctx.beginPath();ctx.ellipse(c.x,c.y,(34+a*4)*S,(70+a*6)*S,0,0,7);ctx.stroke();glowAt(GLOWG,c.x,c.y,50*S,.15*a);ctx.globalCompositeOperation='source-over'}
  if(e&&e.k==='blackout'){const fl=Math.sin(T*31)>.93?.15:0,k=clamp(Math.min(e.dur-e.t,e.t)*2,0,1);ctx.fillStyle=`rgba(3,5,12,${(.62-fl)*k})`;ctx.fillRect(0,0,W,H)}

    ctx.globalAlpha=(1-PG.mood/25)*(.45+.35*Math.sin(T*3.2));ctx.drawImage(PG.vr,0,0);ctx.globalAlpha=1}};

      fn:()=>[PG.update,PG.hud,PG.draw,PG.drawDark,PG.showBox,PG.renderShop,PG.evStart,PG.evUpd,PG.fixUpd,PG.tap,PG.raidOver,PG.save,PG.load],
      data:()=>UPG.length===6&&Object.keys(TRAITS).length===5&&!!$('shop')&&!!$('evb')&&!!$('moodi')}
  ],
  /* не графика, но тоже считается и не должно теряться */
  extra:[['Уровни',3,()=>Object.keys(FLOORS).length],['Миссии',12,()=>MIS_O.length+MIS_C.length+MIS_F.length+(typeof MIS_A==='object'?MIS_A.length:0)],['Комнаты без лифта',1,()=>typeof buildArch==='function'?1:0],['Улучшения',6,()=>UPG.length],['События',7,()=>EVK.length],['Характеры',5,()=>Object.keys(TRAITS).length],
    ['Звуки штурма',15,()=>typeof sfxR==='object'?Object.keys(sfxR).length:0],
    ['Звуки',35,()=>Object.keys(sfx).length+(typeof auInit==='function'&&/createBufferSource/.test(auInit.toString())?1:0)],/* +1 = фоновый гул офиса в auInit */
    ['Реплики',141,()=>[LINES_O,LINES_C,LINES_F,LINES_A].reduce((s,o)=>s+Object.values(o).reduce((a,v)=>a+v.length,0),0)+Object.values(LL).reduce((a,v)=>a+(Array.isArray(v)?(Array.isArray(v[0])?v.length:1):0),0)]]
};
function invCheck(){
  const rows=INV.sec.map(s=>{let ok=true,miss=0;try{const f=s.fn();miss=f.filter(x=>typeof x!=='function').length;ok=!miss&&s.data()}catch(e){ok=false}
    return{...s,n:s.cats.reduce((a,c)=>a+c[1],0),ok}});
  const ex=INV.extra.map(([name,need,get])=>{let have=0;try{have=get()}catch(e){}return{name,need,have,ok:have>=need}});
  const base=INV.hist[INV.hist.length-1][1],now=rows.reduce((a,r)=>a+(r.ok?r.n:0),0);
  const lost=rows.filter(r=>!r.ok).map(r=>r.name).concat(ex.filter(e=>!e.ok).map(e=>e.name));
  return{rows,ex,base,now,lost};
}
(function(){
  const box=$('inv'),list=$('invlist'),st=$('invst'),btn=$('minv');let raf=0;
  const r0=invCheck();if(btn)btn.innerHTML='СОСТАВ: <span>'+r0.now+'</span>';if(r0.lost.length&&btn)btn.classList.add('bad');
  function count(el,to,dur,delay){const t0=performance.now()+delay;const step=t=>{const k=clamp((t-t0)/dur,0,1),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e);if(k<1)raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)}
  function open(){
    const r=invCheck(),top=Math.max(...INV.hist.map(h=>h[1]));
    let h='<div class="ihist">'+INV.hist.map((v,i)=>`<div class="ih" style="--d:${i*.12}s"><i style="--w:${(v[1]/top*100).toFixed(1)}%"></i><b>${v[1]}</b><span>${v[0]}</span></div>`).join('')+'</div>';
    h+=r.rows.map((s,i)=>`<div class="isec${s.ok?'':' bad'}" style="--c:${s.col};--d:${.25+i*.08}s"><div class="ihd"><span>${s.name}<i>${s.sub}</i></span><b data-n="${s.n}">0</b></div>`+
      s.cats.map(c=>`<div class="icat"><span>${c[0]}</span><em>${c[1]}</em></div>`).join('')+(s.ok?'':'<div class="iwarn">ПОТЕРЯНО — вернуть!</div>')+'</div>').join('');
    h+=`<div class="isec ext" style="--c:#cfd8e6;--d:${.25+r.rows.length*.08}s"><div class="ihd"><span>ЕЩЁ В ИГРЕ<i>не графика</i></span></div>`+
      r.ex.map(e=>`<div class="icat${e.ok?'':' bad'}"><span>${e.name}</span><em>${e.have}${e.ok?'':' / '+e.need}</em></div>`).join('')+'</div>';
    list.innerHTML=h;
    st.className=r.lost.length?'bad':'ok';
    st.innerHTML=`<span>Было <b>${r.base}</b></span><span>Сейчас <b id="invnow">0</b></span><span>Потеряно <b>${r.base-r.now+r.ex.filter(e=>!e.ok).length}</b></span>`;
    cancelAnimationFrame(raf);count($('invnow'),r.now,1400,150);
    list.querySelectorAll('.ihd b').forEach((b,i)=>count(b,+b.dataset.n,900,350+i*90));
    box.classList.remove('hide');requestAnimationFrame(()=>box.classList.add('on'));if(typeof sfx!=='undefined'&&AU.ctx)sfx.tap();
  }
  function close(){box.classList.remove('on');box.classList.add('hide');cancelAnimationFrame(raf)}
  if(btn)btn.onclick=open;$('invx').onclick=close;
  addEventListener('keydown',e=>{if(e.code==='KeyI'&&!playing)box.classList.contains('hide')?open():close();if(e.code==='Escape')close()});
  window.__INV=invCheck;
})();
resize();newGame();requestAnimationFrame(frame);
window.__G={PG,get workers(){return workers},spawn,tapWorker,callLift,chooseFloor,get ELEV(){return ELEV},get R3(){return R3},get state(){return{day,mi,mprog,playing,W,H,K,S,LV}}};
