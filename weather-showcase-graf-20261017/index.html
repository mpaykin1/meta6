:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#080d19;color:#fff;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none}

#fx{z-index:3}

#modeTitle{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:8;background:rgba(8,12,25,.68);border:1px solid #ffffff45;border-radius:999px;box-shadow:0 3px 18px #0006;color:#fff1d8;text-align:center;white-space:nowrap;max-width:calc(100vw - 44px);overflow:hidden;text-overflow:ellipsis;padding:8px 16px;font:600 13px system-ui;pointer-events:none;opacity:.85;transition:opacity .7s}
#modeTitle.quiet{opacity:.33}#modeDesc,#weatherLabel{display:none}
#fail{position:fixed;z-index:10;inset:35% 9% auto;padding:24px;display:none;text-align:center;background:#161b32;color:#fff;border:1px solid #cfb28c;border-radius:14px}
@media(max-width:600px){#weather{width:47px;height:47px;font-size:26px}#modeTitle{font-size:12px;padding:7px 13px}}
@media(prefers-reduced-motion:reduce){#modeTitle{transition:none}}
</style>

// GRAF WEATHER V3: one small button; strong FX foreground with 8-frame 2D/2.5D sprites;
// visible through camera's entire projection. Runs in the SAME frame loop as the 3D scene.
function makeWeatherFX(){
 const fc=document.getElementById('fx'),f=fc.getContext('2d',{alpha:true});
 const atlases={};for(const k of ['leaves','petals','fx']){let im=new Image();im.src=DATA[k];atlases[k]=im;}for(const k of Object.keys(PACK25)){let im=new Image();im.src=PACK25[k];atlases['25:'+k]=im;}
 let seed=708014;const random=()=>((seed=Math.imul(seed,1664525)+1013904223|0)>>>0)/4294967296;
 const specs=Array.from({length:370},(_,i)=>({x:random(),y:random(),depth:random(),size:random(),phase:random()*7.99,spin:random()*6.283,rate:.5+random()*1.7,variant:Math.floor(random()*3),row:Math.floor(random()*8),sway:random()*6.283}));
 let prevMode='',last=0;
 function tick(now,w,cameraYaw=0){
  if(!f)return;const mobile=innerWidth<700,dpr=Math.min(devicePixelRatio||1,mobile?1.3:1.5);
  let cw=Math.round(fc.clientWidth*dpr),ch=Math.round(fc.clientHeight*dpr);if(fc.width!==cw||fc.height!==ch){fc.width=cw;fc.height=ch;}
  f.setTransform(1,0,0,1,0,0);f.clearRect(0,0,cw,ch);if(!cw||!ch)return;
  const dt=Math.min(.05,(now-last)/1000||.016);last=now;
  if(w!==prevMode){prevMode=w;for(let i=0;i<specs.length;i++){const p=specs[i];p.y=((i*.7548776662)+random()*.045)%1;p.x=((i*.6180339887)+random()*.045)%1;}}
  let type=['white','red','black','pink','multi'].includes(w)?'petals':w==='leaves'?'leaves':w==='snow'||w==='magic'?'snow':w==='flies'?'flies':w==='storm'?'rain':w==='mist'?'mist':'none';
  let im=type==='petals'?atlases.petals:type==='leaves'?atlases.leaves:atlases.fx;
  // Two depths of actual animated billboard atlas particles plus high-contrast foreground.
  const base=mobile?330:300;
  if(type==='none'){return;}
  if(type==='mist'){
    for(let i=0;i<7;i++){let x=((i*.28+Math.sin(now*.00018+i)*.13)%1)*cw;
     let g=f.createRadialGradient(x,ch*(.32+i*.09),0,x,ch*(.32+i*.09),cw*.55);
     g.addColorStop(0,'rgba(202,232,224,.14)');g.addColorStop(1,'rgba(181,207,212,0)');f.fillStyle=g;f.fillRect(0,0,cw,ch);}
  }
  if(type==='rain'){
   f.lineCap='round';for(let i=0;i<base*2;i++){const p=specs[i%specs.length],speed=(.35+p.rate*.15),x=((p.x+now*.00017*(.6+p.rate))%1.3-.14)*cw;
    const y=((p.y+now*.00065*(.7+p.rate))%1.25-.15)*ch,sz=11+24*p.depth;
    f.strokeStyle=`rgba(195,223,255,${.3+.6*p.depth})`;f.lineWidth=(.8+1.5*p.depth)*dpr;f.beginPath();f.moveTo(x,y);f.lineTo(x-9*dpr,y+sz*dpr);f.stroke();
   }return;
  }
  const target=type==='mist'?base*.72:base;
  for(let i=0;i<target;i++){
   const p=specs[i],depth=p.depth,wind=type==='snow'?.000014:type==='flies'?.000025:.000060;
   let u=((p.x+Math.sin(now*.001+p.sway)*.026*(1+depth)+now*wind*p.rate+(cameraYaw*.010*(.4+depth)))%1.22+1.22)%1.22-.11;
   let v=type==='flies'?((p.y+Math.sin(now*.0008+p.sway)*.09)%1):((p.y+now*(type==='snow'?.000043:.000030)*p.rate)%1.26-.10);
   let x=u*cw,y=v*ch;if(x<-55||x>cw+55||y<-55||y>ch+55)continue;
   let size=(type==='petals'?13:type==='leaves'?13:type==='snow'?8:type==='mist'?14:5)*(1+1.8*depth)*(mobile?1:1.20)*dpr;
   if(type==='flies'||type==='mist'){const brightness=.55+.45*Math.sin(now*.004+p.sway);f.globalAlpha=type==='mist'?.24:brightness;
    f.fillStyle=type==='mist'?'#d9fff2':i%3?'#edff9a':'#86ffda';f.shadowColor=type==='mist'?'#dbfff7':'#b1ff70';f.shadowBlur=14*dpr*(.6+depth);
    f.beginPath();f.arc(x,y,(type==='mist'?7:4.3)*(1+depth)*dpr,0,Math.PI*2);f.fill();f.shadowBlur=0;f.globalAlpha=1;continue;}
   if(type==='snow'){f.save();f.translate(x,y);f.rotate(now*.00014+p.spin);f.strokeStyle=`rgba(229,246,255,${.72+.28*depth})`;f.lineWidth=Math.max(1,size/7);for(let a=0;a<3;a++){f.rotate(Math.PI/3);f.beginPath();f.moveTo(-size/2,0);f.lineTo(size/2,0);f.stroke();}f.restore();continue;}
   if(!im.complete||!im.naturalWidth)continue;
   let kind=type==='leaves'?p.variant:(w==='white'?0:w==='red'?1:w==='black'?2:w==='pink'?0:i%3);
   let frame=(Math.floor(now*.007*p.rate+p.phase))%8;
   let row=(p.row+Math.floor(cameraYaw*1.27))%8;
   f.save();f.translate(x,y);f.rotate(p.spin+Math.sin(now*.002*p.rate+p.sway)*.6);
   f.globalAlpha=.74+.25*depth;
   if(w==='black'){f.filter='brightness(.36) contrast(1.8)';f.shadowBlur=5*dpr;f.shadowColor='#d5a4ec';}
   if(w==='pink')f.filter='hue-rotate(320deg) saturate(1.15)';
   if(w==='white')f.filter='grayscale(1) brightness(1.8)';
   if(w==='multi')f.filter=`hue-rotate(${(i%5)*43}deg) saturate(1.15)`;
   const gkey=type==='leaves'?'maple':type==='snow'?'snow':w==='multi'?'rose_rainbow':'rose_'+w;
   const g=atlases['25:'+gkey];
   if(i%6===0&&g&&g.complete&&g.naturalWidth){f.drawImage(g,frame*64,row*64,64,64,-size*.85,-size*.85,size*1.7,size*1.7);}else{
    const sx=(kind*8+frame)*48, sy=row*96;f.drawImage(im,sx,sy,48,96,-size*.7,-size*.9,size*1.4,size*1.8);
   }
   f.restore();
  }
