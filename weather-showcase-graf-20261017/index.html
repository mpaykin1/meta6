:root{color-scheme:dark;--ink:#090d18;--gold:#ffe1aa}
*{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#050c17;color:#f7eedd;font-family:Georgia,'Times New Roman',serif;-webkit-user-select:none;user-select:none;touch-action:none}
#sky{position:fixed;inset:0;background:radial-gradient(ellipse at 52% 33%,#84647b 0%,#313656 48%,#081325 100%);transition:background 1.5s}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 82% 85% at 48% 43%,transparent 26%,rgba(3,5,15,.15) 60%,rgba(2,4,12,.63));z-index:1}

#hud{position:fixed;inset:0;pointer-events:none;z-index:4; padding:max(22px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));display:flex;flex-direction:column;justify-content:space-between}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.heading{max-width:330px;text-shadow:0 3px 24px rgba(0,0,0,.8)}.kicker{font-family:system-ui,sans-serif;font-size:10px;letter-spacing:.33em;color:#f3c991;text-transform:uppercase;margin-bottom:10px}.logo{font-size:clamp(23px,3.1vw,44px);line-height:.95;letter-spacing:.045em;font-weight:700}.logo span{color:#ffd3a4;font-style:italic}.desc{margin-top:12px;font-size:clamp(11px,1.15vw,14px);line-height:1.6;color:rgba(255,239,216,.75);max-width:280px}
.cta{pointer-events:auto;border:1px solid rgba(255,222,166,.67);border-radius:4px;background:linear-gradient(120deg,rgba(51,30,46,.88),rgba(20,34,57,.95));box-shadow:0 0 28px rgba(255,198,120,.17),inset 0 0 0 1px rgba(255,218,174,.11);backdrop-filter:blur(10px);color:#fff5dd;padding:14px 16px 13px;min-width:180px;max-width:48vw;cursor:pointer;text-align:left;transition:transform .14s,box-shadow .2s;font:600 12px/1.3 system-ui,sans-serif;touch-action:manipulation}
.cta:hover{box-shadow:0 0 32px rgba(255,198,120,.4),inset 0 0 0 1px rgba(255,218,174,.17)}.cta:active{transform:scale(.97)}.cta:focus-visible{outline:3px solid #f9d59c;outline-offset:4px}.ctaTop{display:flex;align-items:center;justify-content:space-between;gap:16px;color:#d2bba9;letter-spacing:.08em;font-size:10px;text-transform:uppercase;margin-bottom:5px}.ctaBig{font-size:clamp(13px,2.5vw,18px);font-family:Georgia,serif;white-space:normal}.ctaHint{font-size:10px;letter-spacing:.015em;color:#bfc7d4;margin-top:8px;font-weight:400}
.footer{display:flex;align-items:end;justify-content:space-between;gap:12px}.mode{border-left:2px solid #e3b88d;padding-left:12px;text-shadow:0 2px 10px #000;max-width:380px}.modeOver{font:10px system-ui,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:#e6b989;margin-bottom:6px}.modeTitle{font-size:clamp(19px,3vw,34px);font-style:italic}.modeDesc{font:12px/1.5 system-ui,sans-serif;color:rgba(247,235,212,.74);margin-top:3px}.hint{font:11px/1.8 system-ui,sans-serif;color:#d1c7c1;text-align:right;text-shadow:0 2px 8px #000}
#flash{pointer-events:none;position:fixed;inset:0;background:#c2d7ff;opacity:0;z-index:3}
#fail{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:none;max-width:min(90vw,600px);padding:28px;background:#121522;border:1px solid #a68e70;color:#f9e6d8;text-align:center;z-index:9;font:16px/1.6 system-ui,sans-serif}

@media(max-width:680px){#hud{padding:16px 14px 19px}.logo{font-size:24px}.kicker{font-size:9px;margin-bottom:6px}.desc{font-size:10px;margin-top:8px;max-width:185px}.cta{padding:12px 11px;min-width:130px}.ctaTop{font-size:9px}.ctaHint{font-size:9px}.modeTitle{font-size:23px}.hint{font-size:10px;max-width:150px}.modeDesc{font-size:11px}}

if(isLeaf)drawParticles(leafLayer,textures.leaves,8,fade,0,view,time);
if(isPetal)drawParticles(petalLayer,textures.petals,8,fade,w==='black'?.3:0,view,time);
if(isSnow)drawParticles(snowLayer,textures.fx,1,fade,.1,view,time);
if(isFire)drawParticles(fireLayer,textures.fx,1,fade,.65,view,time);
}if(w==='storm')drawRain(view,dt);
if(w==='storm'&&Math.sin(time*2.5)*Math.sin(time*3.7)>.90){lightning=1;flashUntil=time+.12};lightning=Math.max(0,lightning-dt*2);flash.style.opacity=(time<flashUntil?.33+Math.random()*.12:0).toFixed(3);
fpsAcc+=dt;fpsFrames++;if(fpsAcc>1){fps=Math.round(fpsFrames/fpsAcc);fpsAcc=0;fpsFrames=0}window.weatherDemoStats={mode:w,frame,particles:isLeaf?budgets.leaf:isPetal?budgets.petals:isSnow?budgets.snow:isFire?budgets.fire:w==='storm'?budgets.rain:0,atlasCount:texReady?3:0,drawcalls:meshes.length+(texReady?1:0),fps,webgl:true,threeDimensional:true};
}
requestAnimationFrame(loop);
})();
</script>
