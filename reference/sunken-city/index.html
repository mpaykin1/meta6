function loop(points) { return new THREE.CatmullRomCurve3(points.map((p) => new V3(...p)), true, 'centripetal'); }
function ring(cx, cy, cz, rx, rz, n = 8, wob = 1, seed = 1) {

}
function mover(o, curve, speed, opt = {}) {

}
function updateMover(M, dt, t) {
  const L = M.curve.getLength();
  M.u = (M.u + M.speed * dt / L) % 1;
  const p = M.curve.getPointAt(M.u, tA), tg = M.curve.getTangentAt(M.u, tB);
  if (M.ground) p.y = groundH(p.x, p.z) + M.lift; else p.y += Math.sin(t * 0.9 + M.u * 40) * M.bob;
  M.o.position.lerp(p, damp(4, dt));
  const yawT = Math.atan2(-tg.z, tg.x) + M.face;
  const dy = angDiff(M.yaw, yawT);
  M.yaw += dy * damp(2.2, dt);
  M.roll += (clamp(-dy * M.bank, -0.4, 0.4) - M.roll) * damp(2, dt);
  M.pitch += (clamp(Math.asin(clamp(tg.y, -1, 1)), -0.5, 0.5) - M.pitch) * damp(2, dt);
  M.o.rotation.set(M.roll, M.yaw, M.pitch, 'YXZ');
}

const SCHOOLS = [];
async function school(id, n, curve, speed, scale, spread) {
  const g = await loadGLB(glbOf(id));
  const parts = flatten(g);
  const meshes = parts.map(({ material, geometry }) => {
    geometry.translate(0, -0.22, 0);
    const im = new THREE.InstancedMesh(geometry, patch(material.clone(), { bend: true }), n);
    im.frustumCulled = false; scene.add(im); return im;
  });
  const fish = [];
  const r = mulberry32(n * 7 + id.length);
  for (let i = 0; i < n; i++) fish.push({ off: new V3((r() - 0.5) * spread, (r() - 0.5) * spread * 0.5, (r() - 0.5) * spread), lag: r() * 0.06,
    p: curve.getPointAt(r()).clone(), v: new V3(), yaw: 0, pitch: 0, s: scale * lerp(0.75, 1.1, r()), ph: r() * TAU });
  const S = { id, meshes, fish, curve, speed, u: rand(), dummy: new THREE.Object3D() };
  SCHOOLS.push(S);
  PICKS.push({ id, school: S });
  return S;
}
function updateSchool(S, dt, t, threat) {
  const L = S.curve.getLength();
  S.u = (S.u + S.speed * dt / L) % 1;
  for (let i = 0; i < S.fish.length; i++) {
    const f = S.fish[i];
    const c = S.curve.getPointAt((S.u - f.lag + 1) % 1, tA);
    tC.copy(f.off).applyAxisAngle(tB.set(0, 1, 0), t * 0.25 + f.ph * 0.1);
    c.add(tC);
    c.y += Math.sin(t * 1.3 + f.ph) * 0.25;
    tC.subVectors(c, f.p);
    const want = tC.multiplyScalar(1.6);
    if (threat) {                                         // the light and the hull scare them away
      tB.subVectors(f.p, threat.p); const d = tB.length();
      if (d < threat.r) want.addScaledVector(tB.normalize(), (threat.r - d) * 3.2);
    }
    f.v.lerp(want, damp(2.6, dt));
    f.p.addScaledVector(f.v, dt);
    const sp = Math.hypot(f.v.x, f.v.z);
    if (sp > 0.05) { const y = Math.atan2(-f.v.z, f.v.x); f.yaw += angDiff(f.yaw, y) * damp(5, dt); }
    f.pitch += (clamp(Math.atan2(f.v.y, Math.max(sp, 0.01)), -0.6, 0.6) - f.pitch) * damp(4, dt);
    S.dummy.position.copy(f.p); S.dummy.rotation.set(0, f.yaw, f.pitch, 'YXZ'); S.dummy.scale.setScalar(f.s); S.dummy.updateMatrix();
    for (const m of S.meshes) m.setMatrixAt(i, S.dummy.matrix);
  }
  for (const m of S.meshes) m.instanceMatrix.needsUpdate = true;
}

/* ════════════════════════════════════════════════════════════════════════════
   9 · the pack as a file
════════════════════════════════════════════════════════════════════════════ */
let DL = null;                  // the viewer's save dialog, when this view offers one
(async () => {

})();
async function savePNG(path) {     // one sprite sheet of the pack, cut back out of its atlas, as the original PNG
  const r = SHOW.rects[path];
  if (!r || !DL) return;
  const im = await atlasImage(r[0], r[1]);
  const c = document.createElement('canvas'); c.width = r[4]; c.height = r[5];
  c.getContext('2d').drawImage(im, r[2], r[3], r[4], r[5], 0, 0, r[4], r[5]);

/* ════════════════════════════════════════════════════════════════════════════
   10 · boot and the frame
════════════════════════════════════════════════════════════════════════════ */
let loaded = 0;
const TOTAL = 96;
const progress = () => { loaded++; $('ldFill').style.width = `${Math.min(100, loaded / TOTAL * 100)}%`; };
const boot = (async () => {
  await buildSeabed();
  $('ldText').textContent = 'Собор, виадук, галеон…';
  await buildCity(progress);
  $('ldText').textContent = 'Выпускаем рыб…';
  await buildLife();
  finalizeHerds();
  roseLight.position.set(0, 6.7, -5.6); roseLight.intensity = 30;
})();
boot.catch((e) => { console.error(e); $('ldText').textContent = 'Часть моделей не загрузилась — обнови страницу.'; });
boot.then(() => {
  $('ldFill').style.width = '100%';
  setTimeout(() => $('loader').classList.add('gone'), 250);
  setTimeout(() => $('loader').remove(), 1600);
});

let last = 0;
function frame(now) {

  G.t += dt; const t = G.t;

  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('show'); }

  // sonar

    S_.t += dt; const r = S_.t * 18; const k = Math.max(0, 1 - S_.t / 2.6);
    sonar.scale.setScalar(Math.max(0.01, r)); sonarMat.uniforms.uK.value = k * 0.8;
    U.uSonarO.value.copy(S_.o); U.uSonarR.value = r; U.uSonarK.value = k;
    if (S_.t > 2.6) { S_.t = -1; sonar.visible = false; U.uSonarK.value = 0; }
  }

    updateHerds();
    const threat = SPOTS.bathy ? { p: SPOTS.bathy.position, r: G.mode === 'pilot' ? 5.5 : 3.5 } : null;
    for (const S of SCHOOLS) updateSchool(S, dt, t, threat);
    updateBubbles(dt, t);
    if (G.mode === 'pilot') updatePilot(dt, t); else { G.dangerT = 0; updateCityCam(dt, t); }
    // the bathyscaphe's lights, the lure's glow, the light shafts facing the camera
    if (SPOTS.bathy) {
      const o = SPOTS.bathy;
      const fw = tA.set(Math.cos(o.rotation.y), 0, -Math.sin(o.rotation.y));
      tB.copy(o.position).addScaledVector(fw, 1.9).add(tC.set(0, 0.2, 0));
      bathSpot.position.copy(tB); bathSpot.target.position.copy(tB).addScaledVector(fw, 10).add(tC.set(0, -3.2, 0)); bathSpot.intensity = 60;
      cone.position.copy(tB); cone.lookAt(bathSpot.target.position); cone.rotateY(-Math.PI / 2);
      bathGlow.position.copy(o.position).add(tC.set(0, -0.4, 0)); bathGlow.intensity = 3 + Math.sin(t * 2.2) * 0.6;
      if (Math.random() < dt * 7) bubble(o.position.x - fw.x * 2.6, o.position.y + 0.3, o.position.z - fw.z * 2.6, 0.7);
    }
    if (SPOTS.angler) {

      if (bulb) { bulb.getWorldPosition(lureLight.position); }
      lureLight.intensity = 9 + Math.sin(t * 3.1) * 2 + Math.sin(t * 17) * 0.8;
    }
    for (const r of rays) { r.rotation.y = Math.atan2(camera.position.x - r.position.x, camera.position.z - r.position.z); r.rotation.z = r.userData.tilt + Math.sin(t * 0.13 + r.position.x) * 0.04; }
    snowMat.uniforms.uCam.value.copy(camera.position); plankMat.uniforms.uCam.value.copy(camera.position);

  G.flash = Math.max(0, G.flash - dt * 1.4);
  G.blip = Math.max(0, G.blip - dt * 1.6);
  G.trauma = Math.max(0, G.trauma - dt * 1.4);
  if (G.trauma > 0 && G.mode === 'pilot' && !REDUCED) { const k = G.trauma * G.trauma * 0.25; camera.position.x += Math.sin(t * 41) * k; camera.position.y += Math.sin(t * 37) * k; }

  FX.uGlitch.value = (G.blip * 0.5 + G.danger * 0.18 * (Math.sin(t * 13) > 0.8 ? 1 : 0) + G.flash * 0.6) * red;
  FX.uDanger.value = G.danger; FX.uVig.value = 0.4 + G.danger * 0.15; FX.uFlash.value = G.flash * 0.3;
  FX.uGrain.value = 0.045 * (REDUCED ? 0.5 : 1); FX.uWave.value = REDUCED ? 0 : 1;

  U.uGlowK.value = (G.mode === 'inspect' ? 0.8 : 0.92) + G.blip * 0.6;

requestAnimationFrame(frame);
function snap(yaw, pitch, dist, fx, fy, fz) {      // jump the city camera (used by tests and deep links)
